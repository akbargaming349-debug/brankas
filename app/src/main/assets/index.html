<style>
:root{
  --bg:#0d1614;
  --surface:#14201d;
  --surface-2:#1a2b26;
  --surface-3:#223731;
  --border:#2b453d;
  --border-gold:rgba(218,180,82,.38);
  --gold:#dab452;
  --gold-bright:#f0cf72;
  --gold-dim:#9b7c2d;
  --text:#eef3f0;
  --muted:#95aba3;
  --danger:#e05c5c;
  --danger-bg:rgba(224,92,92,.14);
  --ok:#49c687;
  --ok-bg:rgba(73,198,135,.14);
  --warn:#eab340;
  --warn-bg:rgba(234,179,64,.14);
  --radius:14px;
  --radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:contain;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;min-height:44px;}
button:disabled{opacity:.48;cursor:not-allowed;}
a{color:var(--gold-bright);text-decoration:none;}
.hidden{display:none!important;}
#app{min-height:100dvh;padding:calc(12px + var(--safe-top)) 14px calc(86px + var(--safe-bottom));max-width:760px;margin:0 auto;}

/* Brand Header */
.brand{display:flex;align-items:center;gap:12px;padding:8px 2px 16px;}
.brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#1d302a,#0f1a17);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);flex-shrink:0;}
.brand-logo svg{width:24px;height:24px;fill:var(--gold);}
.brand-title{font-weight:800;font-size:17px;letter-spacing:.7px;color:var(--gold-bright);line-height:1.15;}
.brand-sub{font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:600;margin-top:2px;}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Cards & Inputs */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.28);}
.card + .card{margin-top:12px;}
.h1{font-size:20px;font-weight:750;margin:0 0 6px;}
.h2{font-size:16px;font-weight:700;margin:0 0 6px;}
.muted{color:var(--muted);font-size:13px;}
.field{margin-top:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);outline:none;transition:border-color .15s;}
.input:focus{border-color:var(--gold);}
.input-pw{padding-right:48px;}
.eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:8px;}
.eye-btn:active{background:var(--surface-2);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;transition:transform .08s,background .15s,border-color .15s;}
.btn:active:not(:disabled){transform:scale(.98);}
.btn-gold{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#111b18;box-shadow:0 4px 14px rgba(218,180,82,.25);}
.btn-secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--text);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger-outline{background:var(--danger-bg);border:1px solid rgba(224,92,92,.45);color:#ffb0b0;}
.btn-sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:9px;}
.btn-block{width:100%;}
.icon-btn{width:44px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
.icon-btn.gold{border-color:var(--border-gold);color:var(--gold-bright);}

/* Alerts & Banners */
.alert{border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;margin-top:12px;border:1px solid var(--border);background:var(--surface-2);}
.alert.err{background:var(--danger-bg);border-color:rgba(224,92,92,.45);color:#ffc4c4;}
.alert.ok{background:var(--ok-bg);border-color:rgba(73,198,135,.4);color:#b9f5d5;}
.alert.warn{background:var(--warn-bg);border-color:rgba(234,179,64,.45);color:#ffe29d;}

/* Home Action Cards */
.home-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px;}
@media(min-width:520px){.home-grid{grid-template-columns:1fr 1fr;}}
.action-card{text-align:left;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--border-gold);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;min-height:132px;justify-content:space-between;}
.action-card:active{transform:scale(.99);}
.action-card-icon{width:44px;height:44px;border-radius:12px;background:rgba(218,180,82,.14);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold-bright);}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);padding:5px;border-radius:12px;border:1px solid var(--border);position:sticky;top:calc(6px + var(--safe-top));z-index:30;backdrop-filter:blur(8px);}
.tab-btn{min-height:42px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab-btn.active{background:linear-gradient(135deg,rgba(218,180,82,.22),rgba(218,180,82,.1));color:var(--gold-bright);border:1px solid var(--border-gold);}

/* Toolbar & Toggles */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap;}
.toolbar-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.seg-toggle{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
.seg-btn{min-height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);}
.seg-btn.active{background:var(--gold);color:#111b18;}
.breadcrumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:10px;font-size:13px;color:var(--muted);}
.crumb{min-height:34px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-weight:600;}
.crumb.current{border-color:var(--border-gold);color:var(--gold-bright);}

/* Folder Cards & Media Grid */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:12px;}
.folder-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;min-height:58px;}
.folder-card:hover{border-color:var(--border-gold);}
.folder-ico{font-size:20px;flex-shrink:0;}
.folder-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.folder-cnt{font-size:11px;color:var(--muted);}

.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;}
@media(min-width:560px){.media-grid{grid-template-columns:repeat(4,1fr);gap:8px;}}
.tile{position:relative;aspect-ratio:1/1;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;user-select:none;}
.tile.selected{border:2px solid var(--gold-bright);box-shadow:0 0 0 2px rgba(240,207,114,.3);}
.tile-media{width:100%;height:100%;object-fit:cover;display:block;background:#0a1210;}
.tile-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-size:11px;background:linear-gradient(145deg,#121e1b,#0c1512);}
.tile-top-left{position:absolute;top:5px;left:5px;display:flex;gap:4px;flex-wrap:wrap;z-index:2;}
.tile-top-right{position:absolute;top:5px;right:5px;display:flex;gap:4px;z-index:2;}
.tile-bot{position:absolute;left:0;right:0;bottom:0;padding:4px 5px;background:linear-gradient(transparent,rgba(0,0,0,.78));display:flex;align-items:center;justify-content:space-between;gap:4px;z-index:2;}
.badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(13,22,20,.84);border:1px solid rgba(255,255,255,.15);color:#fff;letter-spacing:.3px;}
.badge.gold{background:rgba(218,180,82,.92);color:#111b18;border-color:transparent;}
.badge.dup{background:var(--danger);color:#fff;border-color:transparent;}
.badge.off{background:rgba(73,198,135,.9);color:#0b1912;border-color:transparent;}
.tile-btn{width:30px;height:30px;min-height:30px;border-radius:8px;background:rgba(13,22,20,.78);border:1px solid rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
.tile-btn.fav-on{color:#ff6b81;border-color:rgba(255,107,129,.5);background:rgba(45,16,24,.82);}
.tile-check{width:24px;height:24px;border-radius:50%;background:rgba(13,22,20,.82);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#111b18;}
.tile.selected .tile-check{background:var(--gold-bright);border-color:var(--gold-bright);}

/* Bottom Action Bar */
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(20,32,29,.96);border-top:1px solid var(--border-gold);padding:10px 12px calc(10px + var(--safe-bottom));backdrop-filter:blur(10px);}
.bottom-bar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}

/* Top Sheet & Dialog */
.sheet-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.68);display:flex;align-items:flex-start;justify-content:center;padding:calc(10px + var(--safe-top)) 10px 16px;overflow-y:auto;}
.sheet-top{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border-gold);border-radius:16px;overflow:hidden;box-shadow:0 18px 46px rgba(0,0,0,.6);animation:slideDown .16s ease-out;}
@keyframes slideDown{from{transform:translateY(-14px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;}
.sheet-body{max-height:66dvh;overflow-y:auto;padding:10px 14px 14px;}
.tree-row{display:flex;align-items:center;gap:6px;padding:4px 0;}
.tree-toggle{width:36px;height:36px;min-height:36px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--gold-bright);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;}
.tree-item{flex:1;min-height:44px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;}
.tree-item:active{border-color:var(--gold);}
.tree-item-name{font-weight:650;font-size:13px;word-break:break-word;}
.tree-item-cnt{font-size:12px;color:var(--muted);white-space:nowrap;}

/* Modal Viewer (mounted outside #app) */
#modal-root{position:relative;z-index:120;}
.viewer-overlay{position:fixed;inset:0;background:rgba(5,9,8,.96);display:flex;flex-direction:column;z-index:120;touch-action:pan-y;}
.viewer-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + var(--safe-top)) 12px 8px;background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:3;}
.viewer-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.viewer-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;}
.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000;}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:56px;border-radius:12px;background:rgba(20,32,29,.72);border:1px solid var(--border-gold);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:4;}
.viewer-nav.prev{left:8px;}
.viewer-nav.next{right:8px;}
.viewer-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px calc(12px + var(--safe-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:3;}
.no-grab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

/* Upload queue */
.q-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;margin-top:8px;}
.q-item.dup{border-color:var(--warn);}
.q-item.bad{border-color:var(--danger);}
.q-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--border);}
.q-meta{flex:1;min-width:0;}
.q-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.progress-track{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px;border:1px solid var(--border);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));width:0%;transition:width .15s;}

/* Toast & Version */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safe-bottom));z-index:200;width:min(92vw,420px);pointer-events:none;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--surface-3);border:1px solid var(--border-gold);color:var(--text);padding:10px 14px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center;}
.toast.err{background:#3a1919;border-color:var(--danger);color:#ffd2d2;}
.toast.ok{background:#173527;border-color:var(--ok);color:#cbffe4;}
.version-tag{position:fixed;right:10px;bottom:calc(6px + var(--safe-bottom));font-size:11px;color:rgba(149,171,163,.55);z-index:10;pointer-events:none;font-weight:700;}
.spin{display:inline-flex;align-items:center;justify-content:center;animation:sp .8s linear infinite;}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

function sha256BytesFallback(bytes) {
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ]);
  const rotr = (n, x) => (x >>> n) | (x << (32 - n));
  const l = bytes.length;
  const bitLen = l * 8;
  const padLen = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(padLen);
  buf.set(bytes);
  buf[l] = 0x80;
  const view = new DataView(buf.buffer);
  view.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000), false);
  view.setUint32(padLen - 4, bitLen >>> 0, false);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);

  for (let i = 0; i < padLen; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = view.getUint32(i + t * 4, false);
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(7, w[t - 15]) ^ rotr(18, w[t - 15]) ^ (w[t - 15] >>> 3);
      const s1 = rotr(17, w[t - 2]) ^ rotr(19, w[t - 2]) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let t = 0; t < 64; t++) {
      const S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
      const ch = (e & f) ^ ((~e) & g);
      const temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      const S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }
  const out = new Uint8Array(32);
  const ov = new DataView(out.buffer);
  ov.setUint32(0, h0, false); ov.setUint32(4, h1, false); ov.setUint32(8, h2, false); ov.setUint32(12, h3, false);
  ov.setUint32(16, h4, false); ov.setUint32(20, h5, false); ov.setUint32(24, h6, false); ov.setUint32(28, h7, false);
  return out;
}

async function sha256DigestBytes(str) {
  const enc = new TextEncoder().encode(str);
  if (globalThis.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function') {
    try {
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return new Uint8Array(buf);
    } catch (_) {}
  }
  return sha256BytesFallback(enc);
}

async function sha256DigestPair(str) {
  const arr = await sha256DigestBytes(str);
  const hex = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
  let bin = '';
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  const b64 = btoa(bin);
  return { hex, b64 };
}

async function hashText(text) {
  return (await sha256DigestPair('game-vault::' + text)).hex;
}

async function sha256HexRaw(text) {
  return (await sha256DigestPair(text)).hex;
}

function encodePath(p) {
  return String(p || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
}

function splitPath(p) {
  const clean = String(p || '').replace(/^\/+/, '');
  const idx = clean.lastIndexOf('/');
  return {
    folder: idx === -1 ? null : clean.slice(0, idx),
    name: idx === -1 ? clean : clean.slice(idx + 1)
  };
}

function isVideoName(name) {
  const dot = String(name || '').lastIndexOf('.');
  if (dot === -1) return false;
  return VIDEO_EXTS.has(name.slice(dot + 1).toLowerCase());
}

function formatBytes(n) {
  if (!Number.isFinite(n) || n <= 0) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i >= 2 ? v.toFixed(1).replace('.', ',') : Math.round(v)) + ' ' + u[i];
}

function formatEta(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return 'sebentar';
  if (sec < 60) return '±' + Math.max(1, Math.round(sec)) + ' dtk';
  const m = Math.round(sec / 60);
  if (m < 60) return '±' + m + ' mnt';
  const h = Math.floor(m / 60), rm = m % 60;
  return '±' + h + ' jam' + (rm ? ' ' + rm + ' mnt' : '');
}

function showToast(msg, kind = '') {
  const wrap = document.getElementById('toast-root');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .25s';
    setTimeout(() => el.remove(), 260);
  }, 3200);
}

function setLiveText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function setLiveWidth(id, pct) {
  const el = document.getElementById(id);
  if (el) el.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function isLowBandwidth() {
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!c) return false;
  if (c.saveData) return true;
  if (c.effectiveType && ['slow-2g', '2g', '3g'].includes(c.effectiveType)) return true;
  if (c.type === 'cellular') return true;
  return false;
}

/* ==================== KETAHANAN JARINGAN & WORKER ROUTE ==================== */
async function fetchT(url, opts = {}, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(new DOMException('Timeout', 'TimeoutError')), timeoutMs);
  const extSig = opts.signal;
  const onExtAbort = () => ctrl.abort(extSig.reason);
  if (extSig) {
    if (extSig.aborted) { clearTimeout(timer); ctrl.abort(extSig.reason); }
    else extSig.addEventListener('abort', onExtAbort, { once: true });
  }
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
    if (extSig) extSig.removeEventListener('abort', onExtAbort);
  }
}

async function ensureWorkerBase(force = false) {
  if (state.workerChecked && !force) return state.workerBase;
  if (workerProbePromise && !force) return workerProbePromise;
  workerProbePromise = (async () => {
    try {
      const res = await fetchT(WORKER_DIRECT + '/ping', { method: 'GET', cache: 'no-store' }, 6000);
      if (res.ok) {
        const j = await res.json().catch(() => null);
        if (j && j.ok) {
          state.workerBase = WORKER_DIRECT;
          state.workerChecked = true;
          return state.workerBase;
        }
      }
    } catch (_) {}
    const orig = location.origin || '';
    if (orig.startsWith('http') && !orig.includes('appassets.androidplatform.net') && !orig.includes('brankas.local')) {
      try {
        const res2 = await fetchT(orig + '/api/ping', { method: 'GET', cache: 'no-store' }, 6000);
        if (res2.ok) {
          const j2 = await res2.json().catch(() => null);
          if (j2 && j2.ok) {
            state.workerBase = orig + '/api';
            state.workerChecked = true;
            return state.workerBase;
          }
        }
      } catch (_) {}
      state.workerBase = orig + '/api';
    } else {
      state.workerBase = WORKER_DIRECT;
    }
    state.workerChecked = true;
    return state.workerBase;
  })();
  try { return await workerProbePromise; } finally { workerProbePromise = null; }
}

async function netGet(makeReq, { timeout = 15000, tries = 3, onAuthRefresh = true } = {}) {
  let lastErr = null;
  let refreshed = false;
  for (let i = 0; i < tries; i++) {
    const tMs = timeout + i * 10000;
    try {
      const req = await makeReq(i);
      const res = await fetchT(req.url, req.opts || {}, tMs);
      if (res.status === 401 && onAuthRefresh && !refreshed && state.session?.refresh_token) {
        refreshed = true;
        await refreshSession(true);
        continue;
      }
      if (res.status === 429 || res.status >= 500) {
        lastErr = new Error('HTTP ' + res.status);
        if (i < tries - 1) await sleep(800 * (i + 1));
        continue;
      }
      return res;
    } catch (e) {
      lastErr = e;
      if (e?.name === 'AbortError' && !String(e?.message).includes('Timeout')) {
        // external abort
        throw e;
      }
      if (i < tries - 1) await sleep(800 * (i + 1));
    }
  }
  throw lastErr || new Error('Gagal terhubung ke server');
}

window.addEventListener('online', () => { ensureWorkerBase(true); });
if (navigator.connection && navigator.connection.addEventListener) {
  navigator.connection.addEventListener('change', () => { ensureWorkerBase(true); });
}

/* ==================== SUPABASE AUTH & REST ==================== */
async function refreshSession(force = false) {
  if (!state.session?.refresh_token) return false;
  const nowSec = Math.floor(Date.now() / 1000);
  const exp = Number(state.session.expires_at || 0);
  if (!force && exp && exp - nowSec > 180) return true;
  if (refreshTokenPromise) return refreshTokenPromise;
  refreshTokenPromise = (async () => {
    try {
      const res = await fetchT(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: state.session.refresh_token })
      }, 15000);
      if (!res.ok) return false;
      const data = await res.json();
      if (data.access_token) {
        state.session = {
          access_token: data.access_token,
          refresh_token: data.refresh_token || state.session.refresh_token,
          expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600)),
          user: data.user || state.session.user
        };
        return true;
      }
      return false;
    } catch (_) {
      return false;
    } finally {
      refreshTokenPromise = null;
    }
  })();
  return refreshTokenPromise;
}

function startTokenWatcher() {
  stopTokenWatcher();
  tokenTimer = setInterval(() => {
    if (state.session) refreshSession(false);
  }, 60000);
}

function stopTokenWatcher() {
  if (tokenTimer) { clearInterval(tokenTimer); tokenTimer = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.session) {
    refreshSession(false);
  }
});

async function supaFetch(path, opts = {}, retryOn401 = true, timeoutMs = 15000) {
  await refreshSession(false);
  const token = state.session?.access_token;
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
    ...(opts.headers || {})
  };
  let res = await fetchT(SUPABASE_URL + path, { ...opts, headers }, timeoutMs);
  if (res.status === 401 && retryOn401 && state.session?.refresh_token) {
    const ok = await refreshSession(true);
    if (ok) {
      const h2 = { ...headers, 'Authorization': 'Bearer ' + state.session.access_token };
      res = await fetchT(SUPABASE_URL + path, { ...opts, headers: h2 }, timeoutMs);
    }
  }
  return res;
}

async function loginUser(username, password) {
  const cleanUser = String(username || '').trim();
  const candidates = [toFakeEmail(cleanUser)];
  if (cleanUser.includes('@')) {
    const rawEmail = cleanUser.toLowerCase();
    if (!candidates.includes(rawEmail)) candidates.push(rawEmail);
  }
  let res = null;
  let data = {};
  for (const email of candidates) {
    res = await fetchT(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    }, 18000);
    data = await res.json().catch(() => ({}));
    if (res.ok) break;
  }
  if (!res || !res.ok) {
    throw new Error(data.error_description || data.msg || 'Username atau kata sandi login salah.');
  }
  state.session = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600)),
    user: data.user
  };
  startTokenWatcher();
  loadOfflinePausedState();
}

async function registerUser(username, loginPw, viewPw) {
  const email = toFakeEmail(username);
  const res = await fetchT(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: loginPw })
  }, 18000);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.msg || data.error_description || 'Gagal mendaftar. Coba username lain.');
  }
  if (data.access_token) {
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600)),
      user: data.user
    };
  } else {
    await loginUser(username, loginPw);
  }
  startTokenWatcher();
  loadOfflinePausedState();
  const uid = getUserId();
  const view_hash = await hashText(viewPw);
  const saveRes = await supaFetch('/rest/v1/view_passwords', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ user_id: uid, view_hash })
  });
  if (!saveRes.ok) {
    throw new Error('Akun dibuat tapi gagal menyimpan kata sandi lihat. Hubungi admin atau coba lagi.');
  }
}

async function verifyViewPassword(viewPw) {
  const uid = getUserId();
  const uname = getDisplayUsername();
  const baseList = [
    viewPw,
    viewPw.trim(),
    viewPw.normalize('NFC'),
    viewPw.normalize('NFD'),
    viewPw.trim().normalize('NFC')
  ].filter(v => v.length > 0);
  const expanded = [...baseList];
  for (const v of baseList) {
    expanded.push(v.toLowerCase());
    expanded.push(v.toUpperCase());
    if (v.length > 0) {
      expanded.push(v[0].toUpperCase() + v.slice(1));
      expanded.push(v[0].toLowerCase() + v.slice(1));
    }
  }
  const rawVariants = Array.from(new Set(expanded));

  const hexCandidates = new Set();
  const exactCandidates = new Set();
  let primaryHash = '';

  for (const v of rawVariants) {
    const gv = await sha256DigestPair('game-vault::' + v);
    if (!primaryHash && v === viewPw) primaryHash = gv.hex;
    hexCandidates.add(gv.hex);
    exactCandidates.add(gv.b64);

    // Double SHA-256 of game-vault:: + v
    const gv2 = await sha256DigestPair(gv.hex);
    hexCandidates.add(gv2.hex);
    exactCandidates.add(gv2.b64);

    const raw = await sha256DigestPair(v);
    hexCandidates.add(raw.hex);
    exactCandidates.add(raw.b64);

    for (const altStr of [
      'game-vault:' + v,
      'game_vault::' + v,
      v + '::game-vault',
      'brankas::' + v,
      uid + '::' + v,
      uname + '::' + v,
      uname.toLowerCase() + '::' + v
    ]) {
      const alt = await sha256DigestPair(altStr);
      hexCandidates.add(alt.hex);
      exactCandidates.add(alt.b64);
    }

    if (globalThis.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function') {
      try {
        const buf512 = await crypto.subtle.digest('SHA-512', new TextEncoder().encode('game-vault::' + v));
        const a512 = new Uint8Array(buf512);
        hexCandidates.add(Array.from(a512).map(b => b.toString(16).padStart(2, '0')).join(''));
      } catch (_) {}
    }
  }
  if (!primaryHash) primaryHash = await hashText(viewPw);

  const delays = [700, 1600, 3000];
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try {
      const res = await supaFetch(`/rest/v1/view_passwords?user_id=eq.${encodeURIComponent(uid)}&select=view_hash`, {
        method: 'GET'
      }, true, 14000 + i * 6000);
      if (res.status >= 500 || res.status === 429) {
        lastErr = new Error('Server bermasalah (' + res.status + ')');
        if (i < 2) await sleep(delays[i]);
        continue;
      }
      if (!res.ok) {
        throw new Error('Gagal memeriksa kata sandi lihat (' + res.status + ').');
      }
      const rows = await res.json();
      if (!Array.isArray(rows) || rows.length === 0) {
        throw new Error('Kata sandi lihat belum terdaftar untuk akun ini.');
      }
      const normalizeStored = (val) => String(val ?? '')
        .trim()
        .replace(/^["']|["']$/g, '')
        .replace(/^(sha256:|\\x)/i, '');

      const matched = rows.some(r => {
        const storedRaw = normalizeStored(r.view_hash);
        if (!storedRaw) return false;
        if (hexCandidates.has(storedRaw.toLowerCase())) return true;
        if (exactCandidates.has(storedRaw)) return true;
        const looksLikeHash = /^[0-9a-f]{64}$/i.test(storedRaw) || /^[0-9a-f]{128}$/i.test(storedRaw) || /^[A-Za-z0-9+/]{43}=$/.test(storedRaw);
        if (!looksLikeHash && rawVariants.includes(storedRaw)) return true;
        return false;
      });
      if (matched) return { ok: true };

      const firstRaw = normalizeStored(rows[0]?.view_hash);
      const fmt = !firstRaw ? 'kosong (0 kar)'
        : /^[0-9a-f]{64}$/i.test(firstRaw) ? '64-hex'
        : /^[0-9a-f]{128}$/i.test(firstRaw) ? '128-hex'
        : /^[A-Za-z0-9+/]{43}=$/.test(firstRaw) ? '44-b64'
        : `${firstRaw.length} kar`;
      const prev = s => s.length >= 8 ? `${s.slice(0, 4)}…${s.slice(-4)}` : `${s.length}kar`;
      const diag = `DB: ${rows.length} baris (${fmt}${firstRaw ? ' ' + prev(firstRaw.toLowerCase()) : ''}) | Input: ${prev(primaryHash)}`;
      return { ok: false, diag };
    } catch (e) {
      lastErr = e;
      if (e.message.includes('belum terdaftar') || e.message.includes('memeriksa')) throw e;
      if (i < 2) await sleep(delays[i]);
    }
  }
  throw new Error('Gagal terhubung ke server untuk memverifikasi kata sandi lihat. Cek koneksi internet Anda.');
}

async function storageList() {
  const base = await ensureWorkerBase();
  const uid = getUserId();
  await refreshSession(false);
  const res = await netGet((attempt) => {
    const token = state.session?.access_token || '';
    if (attempt === 0) {
      return {
        url: `${base}/list/${encodeURIComponent(uid)}`,
        opts: { method: 'GET', headers: { 'Authorization': 'Bearer ' + token } }
      };
    }
    return {
      url: `${base}/list/${encodeURIComponent(uid)}?token=${encodeURIComponent(token)}`,
      opts: { method: 'GET' }
    };
  }, { timeout: 18000, tries: 3, onAuthRefresh: true });
  if (!res.ok) {
    throw new Error('Gagal terhubung ke server (kode ' + res.status + ').');
  }
  const data = await res.json();
  const rawList = Array.isArray(data) ? data : (data.files || data.items || data.objects || []);
  const explicitFolders = new Set();
  if (Array.isArray(data.folders)) {
    data.folders.forEach(f => {
      const clean = String(f || '').replace(/^\/+|\/+$/g, '');
      if (clean) addFolderWithAncestors(explicitFolders, clean);
    });
  }
  const items = [];
  for (const entry of rawList) {
    let rawPath = String(entry.name || entry.path || entry.key || '').replace(/^\/+/, '');
    if (rawPath.startsWith(uid + '/')) rawPath = rawPath.slice(uid.length + 1);
    if (!rawPath) continue;
    if (rawPath === '.keep') continue;
    if (rawPath.endsWith('/.keep')) {
      const folderPath = rawPath.slice(0, -'/.keep'.length);
      if (folderPath) addFolderWithAncestors(explicitFolders, folderPath);
      continue;
    }
    const sp = splitPath(rawPath);
    if (sp.folder) addFolderWithAncestors(explicitFolders, sp.folder);
    items.push({
      path: rawPath,
      name: sp.name,
      folder: sp.folder,
      type: isVideoName(sp.name) ? 'video' : 'photo',
      size: Number(entry.size || 0),
      uploaded: entry.uploaded || entry.uploadedAt || entry.created_at || '',
      fp: entry.fp || entry.customMetadata?.fp || ''
    });
  }
  return { items, explicitFolders };
}

function addFolderWithAncestors(set, folderPath) {
  const segs = String(folderPath || '').split('/').filter(Boolean);
  let acc = '';
  for (const s of segs) {
    acc = acc ? acc + '/' + s : s;
    set.add(acc);
  }
}

function buildAllFolders(items, explicitFolders) {
  const s = new Set(explicitFolders);
  for (const it of items) {
    if (it.folder) addFolderWithAncestors(s, it.folder);
  }
  return Array.from(s).sort((a, b) => a.localeCompare(b, 'id'));
}

async function workerAuthFetch(path, opts = {}, timeoutMs = 20000) {
  const base = await ensureWorkerBase();
  await refreshSession(false);
  const makeOpts = () => ({
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + (state.session?.access_token || ''),
      ...(opts.headers || {})
    }
  });
  let res = await fetchT(base + path, makeOpts(), timeoutMs);
  if (res.status === 401 && state.session?.refresh_token) {
    const ok = await refreshSession(true);
    if (ok) res = await fetchT(base + path, makeOpts(), timeoutMs);
  }
  return res;
}

async function deleteRemoteFileWithRetry(path) {
  const uid = getUserId();
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try {
      await refreshSession(i > 0);
      const res = await workerAuthFetch(`/file/${encodeURIComponent(uid)}/${encodePath(path)}`, { method: 'DELETE' }, 20000);
      if (res.ok) {
        const j = await res.json().catch(() => ({ ok: true }));
        if (j.ok !== false) return true;
      }
      lastErr = new Error('HTTP ' + res.status);
    } catch (e) {
      lastErr = e;
    }
    if (i < 2) await sleep(700 * (i + 1));
  }
  throw lastErr || new Error('Gagal menghapus file di server');
}

function validateFolderPath(folderName) {
  const clean = String(folderName || '').trim().replace(/^\/+|\/+$/g, '');
  if (!clean) return 'Nama folder tidak boleh kosong.';
  const segs = clean.split('/');
  if (segs.length > 6) return 'Maksimal 6 tingkat folder bersarang.';
  for (const s of segs) {
    if (!s || s === '.' || s === '..' || s.includes('..') || s === '.keep') {
      return 'Nama folder mengandung segmen terlarang.';
    }
    if (s.length > 60) return 'Tiap nama folder maksimal 60 karakter.';
  }
  return null;
}

async function createRemoteFolder(folderName) {
  const clean = String(folderName || '').trim().replace(/^\/+|\/+$/g, '');
  const err = validateFolderPath(clean);
  if (err) throw new Error(err);
  const uid = getUserId();
  const res = await workerAuthFetch(`/folder/${encodeURIComponent(uid)}/${encodePath(clean)}`, { method: 'POST' }, 20000);
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || 'Gagal membuat folder (' + res.status + ').');
  }
  addFolderWithAncestors(state.explicitFolders, clean);
  state.allFolders = buildAllFolders(state.allItems, state.explicitFolders);
}

async function fetchFingerprintsBatch(names) {
  const uid = getUserId();
  const out = {};
  for (let i = 0; i < names.length; i += 6) {
    const batch = names.slice(i, i + 6);
    try {
      const res = await workerAuthFetch(`/fingerprint/${encodeURIComponent(uid)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ names: batch })
      }, 30000);
      if (res.ok) {
        const j = await res.json().catch(() => ({}));
        if (j && j.fps) Object.assign(out, j.fps);
      }
    } catch (_) {}
  }
  return out;
}

async function loadGalleryAll({ showSpinnerToast = false } = {}) {
  state.refreshing = true;
  if (state.screen === 'gallery') render();
  try {
    const { items, explicitFolders } = await storageList();
    state.allItems = items;
    state.explicitFolders = explicitFolders;
    state.allFolders = buildAllFolders(items, explicitFolders);
    state.galleryLoaded = true;
    state.galleryLoadError = null;

    // Pastikan currentFolder masih valid atau kembali ke atas hanya jika folder memang sudah tidak ada
    if (state.currentFolder && !state.allFolders.includes(state.currentFolder)) {
      state.currentFolder = null;
    }

    // Muat tanda offline & favorit dan jalankan rekonsiliasi HANYA setelah daftar galeri berhasil penuh
    await Promise.all([
      loadOfflineMarksAndLocal(),
      loadFavoriteMarks()
    ]);
    await flushPendingMarks();
    await reconcileOfflineLocal();
    await reconcileFavoriteMarks();

    if (showSpinnerToast) showToast('Koleksi diperbarui.', 'ok');
    // Lanjutkan unggahan tertunda & sinkron offline di latar
    resumePendingUploadsFromBackup();

    state.galleryLoadError = e.message || 'Gagal memuat galeri (cek koneksi internet).';
    throw e;
  } finally {
    state.refreshing = false;
    if (state.screen === 'gallery') render();
  }
}

/* ==================== PEMUAT SAMPUL (BAGIAN 5.3) ==================== */
class ThumbLoader {
  constructor() {
    this.blobUrlCache = new Map(); // key -> objectUrl
    this.active = new Map(); // slotKey -> { ctrl, kind, timer }
    this.queued = new Map(); // slotKey -> task
    this.io = null;
    this.scrollTimer = null;
    this.modalPaused = false;
    this.initObserver();
    window.addEventListener('scroll', () => this.onScroll(), { passive: true });
  }

  initObserver() {
    if (!('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver((entries) => {
      for (const ent of entries) {
        const key = ent.target.dataset.thumbKey;
        if (!key) continue;
        if (ent.isIntersecting) {
          this.enqueueFromElement(ent.target);
        } else {
          // Batalkan unduhan yang slotnya jauh keluar layar & bebaskan slot
          const rect = ent.boundingClientRect;
          if (rect.bottom < -1300 || rect.top > window.innerHeight + 1300) {
            this.cancelSlot(key);
          }
        }
      }
      this.pump();
    }, { rootMargin: '1200px 0px 1200px 0px' });
  }

  onScroll() {
    if (this.scrollTimer) clearTimeout(this.scrollTimer);
    this.scrollTimer = setTimeout(() => {
      this.scanVisibleSlots();
    }, 250);
  }

  scanVisibleSlots() {
    const els = document.querySelectorAll('[data-thumb-key]');
    for (const el of els) {
      const r = el.getBoundingClientRect();
      if (r.bottom >= -1200 && r.top <= window.innerHeight + 1200) {
        const key = el.dataset.thumbKey;
        if (!el.dataset.thumbLoaded && !this.active.has(key) && !this.queued.has(key)) {
          this.enqueueFromElement(el);
        }
      }
    }
    this.pump();
  }

  observeGrid() {
    if (this.io) this.io.disconnect();
    const els = document.querySelectorAll('[data-thumb-key]');
    for (const el of els) {
      const key = el.dataset.thumbKey;
      if (this.blobUrlCache.has(key)) {
        this.applyUrlToEl(el, this.blobUrlCache.get(key));
      } else if (this.io) {
        this.io.observe(el);
      } else {
        this.enqueueFromElement(el);
      }
    }
    setTimeout(() => this.scanVisibleSlots(), 60);
  }

  enqueueFromElement(el) {
    const key = el.dataset.thumbKey;
    if (!key || el.dataset.thumbLoaded || this.active.has(key) || this.queued.has(key)) return;
    if (this.blobUrlCache.has(key)) {
      this.applyUrlToEl(el, this.blobUrlCache.get(key));
      return;
    }
    this.queued.set(key, {
      key,
      el,
      kind: el.dataset.thumbKind || 'photo',
      thumbUrl: el.dataset.thumbUrl,
      rawUrl: el.dataset.rawUrl,
      uploadPath: el.dataset.uploadPath || '',
      isShare: el.dataset.thumbShare === '1'
    });
  }

  cancelSlot(key) {
    this.queued.delete(key);
    const act = this.active.get(key);
    if (act) {
      try { act.ctrl.abort(); } catch (_) {}
      if (act.timer) clearTimeout(act.timer);
      this.active.delete(key);
    }
  }

  pauseVideos() {
    this.modalPaused = true;
    for (const [key, act] of this.active.entries()) {
      if (act.kind === 'video') {
        try { act.ctrl.abort(); } catch (_) {}
        if (act.timer) clearTimeout(act.timer);
        this.active.delete(key);
      }
    }
  }

  resumeVideos() {
    this.modalPaused = false;
    this.scanVisibleSlots();
  }

  clearAll() {
    for (const k of Array.from(this.active.keys())) this.cancelSlot(k);
    this.queued.clear();
    for (const u of this.blobUrlCache.values()) {
      try { URL.revokeObjectURL(u); } catch (_) {}
    }
    this.blobUrlCache.clear();
  }

  limits() {
    return isLowBandwidth() ? { photo: 4, video: 3 } : { photo: 10, video: 6 };
  }

  distanceToViewport(el) {
    if (!el || !el.isConnected) return 999999;
    const r = el.getBoundingClientRect();
    const cy = window.innerHeight / 2;
    return Math.abs((r.top + r.bottom) / 2 - cy);
  }

  pump() {
    if (!this.queued.size) return;
    const lim = this.limits();
    let actPhoto = 0, actVideo = 0;
    for (const act of this.active.values()) {
      if (act.kind === 'video') actVideo++; else actPhoto++;
    }
    const sorted = Array.from(this.queued.values()).sort((a, b) => this.distanceToViewport(a.el) - this.distanceToViewport(b.el));
    for (const task of sorted) {
      if (!task.el.isConnected) { this.queued.delete(task.key); continue; }
      if (task.kind === 'video' && this.modalPaused) continue;
      if (task.kind === 'video' && actVideo >= lim.video) continue;
      if (task.kind !== 'video' && actPhoto >= lim.photo) continue;
      this.queued.delete(task.key);
      if (task.kind === 'video') actVideo++; else actPhoto++;
      this.runTask(task);
    }
  }

  applyUrlToEl(el, url) {
    if (!el || !el.isConnected) return;
    const img = el.querySelector('img.tile-media');
    const ph = el.querySelector('.tile-placeholder');
    if (img) {
      img.src = url;
      img.classList.remove('hidden');
    }
    if (ph) ph.classList.add('hidden');
    el.dataset.thumbLoaded = '1';
  }

  async runTask(task) {
    const ctrl = new AbortController();
    const timeoutMs = task.kind === 'video' ? 8000 : 14000;
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    this.active.set(task.key, { ctrl, kind: task.kind, timer });
    try {
      // 1. Coba GET /thumb
      const res = await fetch(task.thumbUrl, { signal: ctrl.signal });
      if (res.ok) {
        const blob = await res.blob();
        if (blob.size > 0) {
          const url = URL.createObjectURL(blob);
          this.blobUrlCache.set(task.key, url);
          this.applyUrlToEl(task.el, url);
          return;
        }
      }
      // 2. Jika 404 (belum ada sampul) dan bukan mode share, buat sampul di browser lalu PUT /thumb
      if (res.status === 404 && !task.isShare && task.rawUrl) {
        const jpegBlob = task.kind === 'video'
          ? await generateVideoThumb(task.rawUrl, ctrl.signal)
          : await generateImageThumb(task.rawUrl, ctrl.signal);
        if (jpegBlob && jpegBlob.size > 0) {
          const url = URL.createObjectURL(jpegBlob);
          this.blobUrlCache.set(task.key, url);
          this.applyUrlToEl(task.el, url);
          if (task.uploadPath && jpegBlob.size <= 400 * 1024) {
            uploadThumbBackground(task.uploadPath, jpegBlob);
          }
        }
      }
    } catch (_) {
      // Abaikan abort / error diam-diam; slot dibebaskan
    } finally {
      clearTimeout(timer);
      this.active.delete(task.key);
      this.pump();
    }
  }
}

const thumbLoader = new ThumbLoader();

async function canvasToJpegCap(canvas, maxBytes = 380 * 1024) {
  for (const q of [0.82, 0.68, 0.52, 0.38]) {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
    if (blob && blob.size <= maxBytes) return blob;
  }
  return await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.3));
}

async function generateImageThumb(url, signal) {
  const res = await fetch(url, { signal });
  if (!res.ok) return null;
  const blob = await res.blob();
  const objUrl = URL.createObjectURL(blob);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = objUrl;
    });
    const maxDim = 480;
    const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return await canvasToJpegCap(c);
  } finally {
    URL.revokeObjectURL(objUrl);
  }
}

async function generateVideoThumb(url, signal) {
  return await new Promise((resolve) => {
    const vid = document.createElement('video');
    vid.muted = true;
    vid.playsInline = true;
    vid.crossOrigin = 'anonymous';
    vid.preload = 'metadata';
    let done = false;
    const finish = (val) => {
      if (done) return;
      done = true;
      vid.pause();
      vid.removeAttribute('src');
      try { vid.load(); } catch (_) {}
      resolve(val);
    };
    const onAbort = () => finish(null);
    if (signal) {
      if (signal.aborted) return finish(null);
      signal.addEventListener('abort', onAbort, { once: true });
    }
    const hardTimer = setTimeout(() => finish(null), 7500);
    vid.onloadeddata = () => {
      try {
        vid.currentTime = Math.min(0.6, (vid.duration || 1) * 0.1);
      } catch (_) {}
    };
    vid.onseeked = async () => {
      clearTimeout(hardTimer);
      try {
        const vw = vid.videoWidth || 480;
        const vh = vid.videoHeight || 480;
        const scale = Math.min(1, 480 / Math.max(vw, vh));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(vw * scale));
        c.height = Math.max(1, Math.round(vh * scale));
        c.getContext('2d').drawImage(vid, 0, 0, c.width, c.height);
        finish(await canvasToJpegCap(c));
      } catch (_) {
        finish(null);
      }
    };
    vid.onerror = () => { clearTimeout(hardTimer); finish(null); };
    vid.src = url;
  });
}

function loadOfflinePausedState() {

  state.offlineSyncRunning = false;
  state.offlineSyncStatus = '';

function getOfflineMetaMap() {
  const uid = getUserId();

  try { return JSON.parse(localStorage.getItem(offlineMetaKey(uid)) || '{}') || {}; } catch (_) { return {}; }

function setOfflineMetaEntry(path, savedAt) {
  const uid = getUserId();
  if (!uid) return;
  const m = getOfflineMetaMap();
  if (savedAt == null) delete m[path]; else m[path] = savedAt;
  try { localStorage.setItem(offlineMetaKey(uid), JSON.stringify(m)); } catch (_) {}
}

async function saveOfflineBlobWithRetry(path, blob) {
  if (!('caches' in window)) throw new Error('Browser tidak mendukung penyimpanan offline (Cache API).');
  const uid = getUserId();
  const delays = [400, 900];
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try {
      const cache = await caches.open(OFFLINE_CACHE_NAME);
      const req = new Request(offlineCacheUrl(uid, path));
      const resp = new Response(blob, {
        headers: {
          'Content-Type': blob.type || 'application/octet-stream',
          'X-Saved-At': String(Date.now())
        }
      });
      await cache.put(req, resp);
      const savedAt = Date.now();
      setOfflineMetaEntry(path, savedAt);
      state.offlineLocalMap.set(path, { size: blob.size, savedAt });
      return true;
    } catch (e) {
      lastErr = e;
      if (i < 2) await sleep(delays[i]);
    }
  }
  throw lastErr || new Error('Gagal menyimpan blob ke penyimpanan HP.');
}

async function getOfflineBlob(path) {
  if (!('caches' in window)) return null;
  const uid = getUserId();
  try {
    const cache = await caches.open(OFFLINE_CACHE_NAME);
    const res = await cache.match(offlineCacheUrl(uid, path));
    if (!res) return null;
    return await res.blob();
  } catch (_) {
    return null;
  }
}

async function deleteOfflineBlob(path) {
  const uid = getUserId();
  state.offlineLocalMap.delete(path);
  setOfflineMetaEntry(path, null);
  if (!('caches' in window)) return;
  try {
    const cache = await caches.open(OFFLINE_CACHE_NAME);
    await cache.delete(offlineCacheUrl(uid, path));
  } catch (_) {}
}

async function scanLocalOfflineCache() {
  const uid = getUserId();
  state.offlineLocalMap.clear();
  if (!uid || !('caches' in window)) return;
  const meta = getOfflineMetaMap();
  try {
    const cache = await caches.open(OFFLINE_CACHE_NAME);
    const reqs = await cache.keys();
    const prefix = 'https://brankas-offline.local/' + encodeURIComponent(uid) + '/';
    for (const req of reqs) {
      if (!req.url.startsWith(prefix)) continue;
      const relEnc = req.url.slice(prefix.length);
      const path = relEnc.split('/').map(decodeURIComponent).join('/');
      const resp = await cache.match(req);
      const savedHeader = Number(resp?.headers?.get('X-Saved-At') || 0);
      const savedAt = savedHeader || Number(meta[path] || 0);
      state.offlineLocalMap.set(path, { size: Number(resp?.headers?.get('Content-Length') || 0), savedAt });
    }
  } catch (_) {}
}

async function loadOfflineMarksAndLocal() {
  await scanLocalOfflineCache();
  const uid = getUserId();
  if (!uid) return;
  const res = await supaFetch(`/rest/v1/offline_marks?user_id=eq.${encodeURIComponent(uid)}&select=path,name,created_at`);
  if (res.ok) {
    const rows = await res.json();
    const m = new Map();
    for (const r of rows) {
      if (r.path) m.set(r.path, r);
    }
    state.offlineMarks = m;
  }
}

function getPendingMarks() {
  try { return JSON.parse(localStorage.getItem(PENDING_MARKS_KEY) || '[]') || []; } catch (_) { return []; }
}

function pushPendingMark(op) {
  const list = getPendingMarks();
  list.push({ ...op, userId: getUserId(), ts: Date.now() });
  try { localStorage.setItem(PENDING_MARKS_KEY, JSON.stringify(list)); } catch (_) {}
}

async function upsertOfflineMark(path, name) {
  const uid = getUserId();
  const res = await supaFetch('/rest/v1/offline_marks?on_conflict=user_id,path', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id: uid, path, name })
  });
  if (!res.ok) throw new Error('Gagal menandai offline di akun (' + res.status + ').');
  state.offlineMarks.set(path, { path, name, created_at: new Date().toISOString() });
}

async function deleteOfflineMark(path) {
  const uid = getUserId();
  state.offlineMarks.delete(path);
  const res = await supaFetch(`/rest/v1/offline_marks?user_id=eq.${encodeURIComponent(uid)}&path=eq.${encodeURIComponent(path)}`, {
    method: 'DELETE'
  });
  if (!res.ok) throw new Error('Gagal menghapus tanda offline di akun.');
}

async function flushPendingMarks() {
  const uid = getUserId();
  const list = getPendingMarks();
  if (!list.length) return;
  const remain = [];
  for (const op of list) {
    if (op.userId && op.userId !== uid) { remain.push(op); continue; }
    try {
      if (op.kind === 'offline_add') await upsertOfflineMark(op.path, op.name);
      else if (op.kind === 'offline_del') await deleteOfflineMark(op.path);
      else if (op.kind === 'fav_add') await upsertFavoriteMarkRemote(op.path, op.name);
      else if (op.kind === 'fav_del') await deleteFavoriteMarkRemote(op.path);
    } catch (_) {
      remain.push(op);
    }
  }
  try { localStorage.setItem(PENDING_MARKS_KEY, JSON.stringify(remain)); } catch (_) {}
}

async function markItemOffline(item, { silent = false } = {}) {
  let blobOk = false;
  let blobErr = null;
  // 1. Simpan blob ke Cache Storage HP
  try {
    if (!state.offlineLocalMap.has(item.path)) {
      const base = await ensureWorkerBase();
      await refreshSession(false);
      const url = `${base}/file/${encodeURIComponent(getUserId())}/${encodePath(item.path)}?token=${encodeURIComponent(state.session?.access_token || '')}`;
      const res = await fetchT(url, { method: 'GET' }, 120000);
      if (!res.ok) throw new Error('Gagal mengunduh file (' + res.status + ').');
      const blob = await res.blob();
      await saveOfflineBlobWithRetry(item.path, blob);
    }
    blobOk = true;
  } catch (e) {
    blobErr = e;
  }
  // 2. Simpan tanda di akun Supabase
  let markErr = null;
  try {
    await upsertOfflineMark(item.path, item.name);
  } catch (e) {
    markErr = e;
    pushPendingMark({ kind: 'offline_add', path: item.path, name: item.name });
  }
  if (!blobOk && markErr) {
    throw new Error('Gagal simpan ke HP (' + (blobErr?.message || 'error') + ') DAN gagal menandai di akun.');
  }
  if (!blobOk) {
    throw new Error('Ditandai di akun, tetapi gagal simpan lokal ke HP: ' + (blobErr?.message || 'Cache error'));
  }
  if (markErr) {
    throw new Error('Tersimpan di HP, tetapi gagal menandai di akun (akan dicoba ulang otomatis).');
  }
  if (!silent) showToast('Tersimpan offline: ' + item.name, 'ok');
}

async function removeOfflineItem(path, { alsoRemoveAccountMark = true } = {}) {
  await deleteOfflineBlob(path);
  if (alsoRemoveAccountMark) {
    try { await deleteOfflineMark(path); } catch (_) { pushPendingMark({ kind: 'offline_del', path }); }
  }
}

async function reconcileOfflineLocal() {
  if (!state.galleryLoaded || state.galleryLoadError) return;
  const byPath = new Map(state.allItems.map(it => [it.path, it]));
  const byPlainName = new Map();
  for (const it of state.allItems) {
    if (!byPlainName.has(it.name)) byPlainName.set(it.name, []);
    byPlainName.get(it.name).push(it);
  }

  // Rekonsiliasi blob lokal
  const now = Date.now();
  for (const [path, info] of Array.from(state.offlineLocalMap.entries())) {
    if (byPath.has(path)) continue;
    const plain = splitPath(path).name;
    const cands = byPlainName.get(plain) || [];
    if (cands.length === 1) {
      const target = cands[0];
      const blob = await getOfflineBlob(path);
      if (blob) {
        await saveOfflineBlobWithRetry(target.path, blob).catch(() => {});
        await deleteOfflineBlob(path);
        if (state.offlineMarks.has(path)) {
          await deleteOfflineMark(path).catch(() => {});
          await upsertOfflineMark(target.path, target.name).catch(() => {});
        }
      }
    } else {
      // Hapus blob hantu hanya jika melewati masa tenggang 3 menit
      if (info.savedAt && now - info.savedAt > GRACE_GHOST_MS) {
        await deleteOfflineBlob(path);
      }
    }
  }

  // Rekonsiliasi tanda offline di akun (hanya tanda, BUKAN file R2)
  for (const [path, mark] of Array.from(state.offlineMarks.entries())) {
    if (byPath.has(path)) continue;
    const plain = splitPath(path).name || mark.name;
    const cands = byPlainName.get(plain) || [];
    if (cands.length === 1) {
      const target = cands[0];
      await deleteOfflineMark(path).catch(() => {});
      await upsertOfflineMark(target.path, target.name).catch(() => {});
    } else {
      const age = mark.created_at ? (now - new Date(mark.created_at).getTime()) : GRACE_GHOST_MS + 1;
      if (age > GRACE_GHOST_MS) {
        await deleteOfflineMark(path).catch(() => {});
      }
    }
  }
}

async function migrateMarksAfterMove(moves) {
  for (const { from, to } of moves) {
    const newName = splitPath(to).name;
    // Offline local blob
    if (state.offlineLocalMap.has(from)) {
      const blob = await getOfflineBlob(from);
      if (blob) await saveOfflineBlobWithRetry(to, blob).catch(() => {});
      await deleteOfflineBlob(from);
    }
    // Offline mark
    if (state.offlineMarks.has(from)) {
      await deleteOfflineMark(from).catch(() => {});
      await upsertOfflineMark(to, newName).catch(() => pushPendingMark({ kind: 'offline_add', path: to, name: newName }));
    }
    // Favorite mark
    if (state.favoriteMarks.has(from)) {
      await deleteFavoriteMarkRemote(from).catch(() => {});
      await upsertFavoriteMarkRemote(to, newName).catch(() => pushPendingMark({ kind: 'fav_add', path: to, name: newName }));
    }
  }
}

async function syncOfflineDownloads() {
  if (state.offlinePaused || state.offlineSyncRunning || !state.galleryLoaded) return;
  const byPath = new Map(state.allItems.map(it => [it.path, it]));
  const missing = [];
  for (const path of state.offlineMarks.keys()) {
    if (!state.offlineLocalMap.has(path) && byPath.has(path)) {
      missing.push(byPath.get(path));
    }
  }
  if (!missing.length) return;
  state.offlineSyncRunning = true;
  const ctrl = new AbortController();
  state.offlineSyncAbort = ctrl;
  let okCount = 0;
  const failedNames = [];
  render();
  try {
    const base = await ensureWorkerBase();
    for (let i = 0; i < missing.length; i++) {
      if (state.offlinePaused || ctrl.signal.aborted) break;
      const it = missing[i];
      state.offlineSyncStatus = `Mengunduh offline (${i + 1}/${missing.length}): ${it.name}`;
      setLiveText('offline-sync-text', state.offlineSyncStatus);
      try {
        await refreshSession(false);
        const url = `${base}/file/${encodeURIComponent(getUserId())}/${encodePath(it.path)}?token=${encodeURIComponent(state.session?.access_token || '')}`;
        const res = await fetchT(url, { method: 'GET', signal: ctrl.signal }, 120000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        await saveOfflineBlobWithRetry(it.path, blob);
        okCount++;
      } catch (e) {
        if (ctrl.signal.aborted || state.offlinePaused) break;
        failedNames.push(it.name);
      }
    }
  } finally {
    state.offlineSyncRunning = false;
    state.offlineSyncAbort = null;
    state.offlineSyncStatus = '';
    if (!state.offlinePaused && (okCount > 0 || failedNames.length > 0)) {
      const msg = failedNames.length
        ? `Sinkron offline: berhasil ${okCount}, gagal ${failedNames.length} (${failedNames.slice(0, 3).join(', ')})`
        : `Sinkron offline selesai: ${okCount} item disimpan.`;
      showToast(msg, failedNames.length ? 'err' : 'ok');
    }
    if (state.screen === 'gallery') render();
  }
}

async function downloadRemoteOfflineOneByOne(items) {
  let ok = 0, fail = 0;
  const base = await ensureWorkerBase();
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    showToast(`Mengunduh (${i + 1}/${items.length}): ${it.name}`);
    try {
      await refreshSession(false);
      const url = `${base}/file/${encodeURIComponent(getUserId())}/${encodePath(it.path)}?token=${encodeURIComponent(state.session?.access_token || '')}`;
      const res = await fetchT(url, { method: 'GET' }, 120000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      await saveOfflineBlobWithRetry(it.path, blob);
      ok++;
    } catch (_) {
      fail++;
    }
  }
  showToast(`Unduh offline: berhasil ${ok}${fail ? ', gagal ' + fail : ''}.`, fail ? 'err' : 'ok');
  render();
}

async function loadFavoriteMarks() {
  const uid = getUserId();
  if (!uid) return;
  try {
    let res = await supaFetch(`/rest/v1/favorite_marks?user_id=eq.${encodeURIComponent(uid)}&select=path,name,created_at&order=created_at.desc`);
    if (res.status === 400) {
      // Fallback jika kolom created_at belum tersedia
      res = await supaFetch(`/rest/v1/favorite_marks?user_id=eq.${encodeURIComponent(uid)}&select=path,name`);
    }
    if (!res.ok) return; // Jangan kosongkan daftar jika gagal memuat!
    const rows = await res.json();
    const next = new Map();
    for (const r of rows) {
      if (r.path) next.set(r.path, r);
    }
    // Jangan timpa perubahan hati yang baru ditekan sambil refresh berjalan
    for (const [p, desired] of state.favDesired.entries()) {
      if (state.favSyncInFlight.has(p)) {
        if (desired) next.set(p, state.favoriteMarks.get(p) || { path: p, name: splitPath(p).name, created_at: new Date().toISOString() });
        else next.delete(p);
      }
    }
    state.favoriteMarks = next;
  } catch (_) {
    // Pertahankan state.favoriteMarks yang sudah ada
  }
}

async function upsertFavoriteMarkRemote(path, name) {
  const uid = getUserId();
  const res = await supaFetch('/rest/v1/favorite_marks?on_conflict=user_id,path', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id: uid, path, name })
  });

async function deleteFavoriteMarkRemote(path) {
  const uid = getUserId();
  const res = await supaFetch(`/rest/v1/favorite_marks?user_id=eq.${encodeURIComponent(uid)}&path=eq.${encodeURIComponent(path)}`, {
    method: 'DELETE'

  if (!res.ok) throw new Error('Gagal menghapus favorit (' + res.status + ').');

function resolveFavoriteMarkedItem(markPath, markName, byPath, byPlainName) {
  if (byPath.has(markPath)) return { item: byPath.get(markPath), migratedFrom: null };
  const plain = splitPath(markPath).name || markName;
  const cands = byPlainName.get(plain) || [];
  if (cands.length === 1) return { item: cands[0], migratedFrom: markPath };
  return { item: null, migratedFrom: null };
}

async function reconcileFavoriteMarks() {
  if (!state.galleryLoaded || state.galleryLoadError) return;
  const byPath = new Map(state.allItems.map(it => [it.path, it]));
  const byPlainName = new Map();
  for (const it of state.allItems) {
    if (!byPlainName.has(it.name)) byPlainName.set(it.name, []);
    byPlainName.get(it.name).push(it);
  }
  for (const [path, mark] of Array.from(state.favoriteMarks.entries())) {
    if (state.favSyncInFlight.has(path)) continue;
    const res = resolveFavoriteMarkedItem(path, mark.name, byPath, byPlainName);
    if (res.item && res.migratedFrom) {
      state.favoriteMarks.delete(path);
      state.favoriteMarks.set(res.item.path, { path: res.item.path, name: res.item.name, created_at: mark.created_at || new Date().toISOString() });
      await deleteFavoriteMarkRemote(path).catch(() => {});
      await upsertFavoriteMarkRemote(res.item.path, res.item.name).catch(() => {});
    } else if (!res.item) {
      state.favoriteMarks.delete(path);
      await deleteFavoriteMarkRemote(path).catch(() => {});
    }
  }
}

function getValidFavoriteItems() {
  const byPath = new Map(state.allItems.map(it => [it.path, it]));
  const out = [];
  const entries = Array.from(state.favoriteMarks.entries()).sort((a, b) => {
    const ta = a[1].created_at ? new Date(a[1].created_at).getTime() : 0;
    const tb = b[1].created_at ? new Date(b[1].created_at).getTime() : 0;
    return tb - ta;
  });
  for (const [path] of entries) {
    const it = byPath.get(path);
    if (it) out.push(it);
  }
  return out;
}

function updateFavoriteDomInPlace(path, isFav) {
  document.querySelectorAll(`[data-fav-path]`).forEach(btn => {
    if (btn.dataset.favPath === path) {
      btn.classList.toggle('fav-on', isFav);
      const isModalBtn = btn.id === 'mv-fav';
      btn.innerHTML = svgIcon(isFav ? 'heart' : 'heartOutline', isModalBtn ? 15 : 14) + (isModalBtn ? ' Favorit' : '');
      btn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
    }
  });
  const tabEl = document.getElementById('tab-fav-btn');
  if (tabEl) {
    tabEl.textContent = `Favorit (${getValidFavoriteItems().length})`;
  }
}

function toggleFavoriteOptimistic(item) {
  const path = item.path;
  const prev = state.favoriteMarks.has(path);
  const next = !prev;
  const seq = (state.favOpSeq.get(path) || 0) + 1;
  state.favOpSeq.set(path, seq);
  state.favDesired.set(path, next);

  if (next) {
    state.favoriteMarks.set(path, { path, name: item.name, created_at: new Date().toISOString() });
  } else {
    state.favoriteMarks.delete(path);
  }

  // Perubahan ikon INSTAN tanpa render ulang seluruh grid
  updateFavoriteDomInPlace(path, next);

  const prevChain = state.favSyncInFlight.get(path) || Promise.resolve();
  const chain = prevChain.then(async () => {
    // Hanya kirim jika ini status paling akhir yang diinginkan
    if (state.favOpSeq.get(path) !== seq) return;
    const desired = state.favDesired.get(path);
    try {
      if (desired) await upsertFavoriteMarkRemote(path, item.name);
      else await deleteFavoriteMarkRemote(path);
    } catch (e) {
      if (state.favOpSeq.get(path) === seq) {
        if (desired) state.favoriteMarks.delete(path);
        else state.favoriteMarks.set(path, { path, name: item.name, created_at: new Date().toISOString() });
        updateFavoriteDomInPlace(path, !desired);
        showToast('Gagal menyimpan favorit: ' + (e.message || 'kesalahan jaringan'), 'err');
        if (state.currentTab === 'favorit') render();
      }
    }
  });
  state.favSyncInFlight.set(path, chain);
  chain.finally(() => {
    if (state.favSyncInFlight.get(path) === chain) {
      state.favSyncInFlight.delete(path);
      if (state.currentTab === 'favorit' && !next) render();
    }
  });
}

/* ==================== UNGGAH, OPFS, SIDIK JARI, RESUME (BAGIAN 5.1) ==================== */
async function computeFingerprint(file) {
  const size = file.size;
  const sliceLen = 64 * 1024;
  let buf;
  if (size <= sliceLen * 12) {
    buf = new Uint8Array(await file.arrayBuffer());
  } else {
    const parts = [];
    for (let i = 0; i < 12; i++) {
      const start = Math.floor((size - sliceLen) * (i / 11));
      const ab = await file.slice(start, start + sliceLen).arrayBuffer();
      parts.push(new Uint8Array(ab));
    }
    const total = parts.reduce((s, p) => s + p.length, 0);
    buf = new Uint8Array(total);
    let off = 0;
    for (const p of parts) { buf.set(p, off); off += p.length; }
  }
  const digest = await crypto.subtle.digest('SHA-256', buf);
  const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  return size + ':' + hex;
}

async function checkFileReadable(file) {
  try {
    const headLen = Math.min(64, file.size);
    if (headLen > 0) await file.slice(0, headLen).arrayBuffer();
    if (file.size > 64) await file.slice(file.size - 64, file.size).arrayBuffer();
    return true;
  } catch (_) {
    return false;
  }
}

async function getOpfsTempDir() {
  if (!navigator.storage || !navigator.storage.getDirectory) return null;
  try {
    const root = await navigator.storage.getDirectory();
    return await root.getDirectoryHandle(OPFS_DIR_NAME, { create: true });
  } catch (_) {
    return null;
  }
}

async function cleanupOpfsOrphans(keepNames = new Set()) {
  const dir = await getOpfsTempDir();
  if (!dir) return;
  try {
    for await (const [name] of dir.entries()) {
      if (!keepNames.has(name)) {
        await dir.removeEntry(name).catch(() => {});
      }
    }
  } catch (_) {}
}

async function copyFileToOpfs(qItem) {
  const dir = await getOpfsTempDir();
  if (!dir) return null;
  const safeName = qItem.id + '_' + qItem.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  try {
    const fh = await dir.getFileHandle(safeName, { create: true });
    const writable = await fh.createWritable();
    const step = 4 * 1024 * 1024;
    let offset = 0;
    while (offset < qItem.file.size) {
      const slice = qItem.file.slice(offset, Math.min(qItem.file.size, offset + step));
      const ab = await slice.arrayBuffer();
      await writable.write(ab);
      offset += ab.byteLength;
      const pct = qItem.file.size ? Math.round((offset / qItem.file.size) * 100) : 100;
      setLiveText(`q-status-${qItem.id}`, `Menyalin ke penyimpanan sementara HP… ${pct}%`);
    }
    await writable.close();
    qItem.opfsName = safeName;
    qItem.opfsFile = await fh.getFile();
    setLiveText(`q-status-${qItem.id}`, 'Siap diunggah (tersalin aman)');
    return qItem.opfsFile;
  } catch (_) {
    await dir.removeEntry(safeName).catch(() => {});
    return null;
  }
}

async function deleteOpfsCopy(qItem) {
  if (!qItem?.opfsName) return;
  const dir = await getOpfsTempDir();
  if (dir) await dir.removeEntry(qItem.opfsName).catch(() => {});
  qItem.opfsName = null;
  qItem.opfsFile = null;
}

}
