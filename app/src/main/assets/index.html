            </div>
          </div>
        </div>
      </div>
    `;
  }

  return '';
}

/* ==================== RENDER UTAMA & EVENT BINDINGS ==================== */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  let html = '';
  if (state.screen === 'share') html = renderPublicSharePage();
  else if (state.screen === 'login') html = renderLogin();
  else if (state.screen === 'register') html = renderRegister();
  else if (state.screen === 'home') html = renderHome();
  else if (state.screen === 'lock') html = renderLock();
  else if (state.screen === 'upload') html = renderUpload();
  else if (state.screen === 'gallery') html = renderGallery();
  app.innerHTML = html + renderActiveSheet();
  bindEvents();
  if (state.screen === 'gallery' || (state.screen === 'share' && state.shareData?.type !== 'file')) {
    thumbLoader.observeGrid();
  }
}

function bindEvents() {
  // Eye toggles
  document.querySelectorAll('[data-eye]').forEach(btn => {
    btn.onclick = () => {
      const inp = document.getElementById(btn.dataset.eye);
      if (inp) {
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        btn.innerHTML = svgIcon(show ? 'eyeOff' : 'eye', 18);
      }
    };
  });

  // Login
  const fLogin = document.getElementById('form-login');
  if (fLogin) {
    fLogin.onsubmit = async (e) => {
      e.preventDefault();
      const uname = document.getElementById('in-user').value.trim();
      const pw = document.getElementById('in-pw').value;
      state.loginUserDraft = uname;
      state.authLoading = true; state.authMsg = null; render();
      try {
        await loginUser(uname, pw);
        state.loginUserDraft = '';
        state.screen = 'home';
      } catch (err) {
        state.authMsg = err.message;
      } finally {
        state.authLoading = false; render();
      }
    };
  }
  const goReg = document.getElementById('go-register');
  if (goReg) goReg.onclick = () => { state.authMsg = null; state.screen = 'register'; render(); };

  // Register
  const fReg = document.getElementById('form-register');
  if (fReg) {
    fReg.onsubmit = async (e) => {
      e.preventDefault();
      const u = document.getElementById('reg-user').value.trim();
      const p1 = document.getElementById('reg-pw1').value;
      const p2 = document.getElementById('reg-pw2').value;
      const v1 = document.getElementById('reg-vp1').value;
      const v2 = document.getElementById('reg-vp2').value;
      if (p1 !== p2) { state.authMsg = 'Pengulangan kata sandi login tidak sama.'; render(); return; }
      if (v1 !== v2) { state.authMsg = 'Pengulangan kata sandi lihat galeri tidak sama.'; render(); return; }
      if (v1 === p1) { state.authMsg = 'Kata sandi lihat galeri HARUS berbeda dari kata sandi login.'; render(); return; }
      state.authLoading = true; state.authMsg = null; render();
      try {
        await registerUser(u, p1, v1);
        showToast('Akun berhasil dibuat!', 'ok');
        state.screen = 'home';
      } catch (err) {
        state.authMsg = err.message;
      } finally {
        state.authLoading = false; render();
      }
    };
  }
  const goLog = document.getElementById('go-login');
  if (goLog) goLog.onclick = () => { state.authMsg = null; state.screen = 'login'; render(); };

  // Logout & Home
  const btnLogout = document.getElementById('btn-logout');
  if (btnLogout) btnLogout.onclick = logout;
  const cUp = document.getElementById('card-upload');
  if (cUp) cUp.onclick = () => { state.uploadTargetFolder = null; state.screen = 'upload'; render(); };
  const cGal = document.getElementById('card-gallery');
  if (cGal) cGal.onclick = () => { state.lockMsg = null; state.lockPwDraft = ''; state.screen = 'lock'; render(); };

  // Lock screen
  const fLock = document.getElementById('form-lock');
  if (fLock) {
    fLock.onsubmit = async (e) => {
      e.preventDefault();
      const vp = document.getElementById('in-viewpw').value;
      state.lockPwDraft = vp;
      state.lockLoading = true; state.lockMsg = null; render();
      try {
        const res = await verifyViewPassword(vp);
        if (!res.ok) {
          state.lockMsg = `Kata sandi lihat galeri salah. Ketuk ikon mata untuk cek ketikan. [${res.diag}]`;
          return;
        }
        try {
          await loadGalleryAll();
          state.lockPwDraft = '';
          state.screen = 'gallery';
        } catch (galErr) {
          state.lockPwDraft = '';
          state.lockMsg = 'Kata sandi benar, namun gagal memuat daftar galeri: ' + (galErr?.message || 'cek koneksi internet.');
        }
      } catch (err) {
        state.lockMsg = err.message;
      } finally {
        state.lockLoading = false; render();
      }
    };
  }
  const btnLockBack = document.getElementById('btn-lock-back');
  if (btnLockBack) btnLockBack.onclick = () => { state.lockPwDraft = ''; state.screen = 'home'; render(); };
  const btnRetryUnlock = document.getElementById('btn-retry-unlock-list');
  if (btnRetryUnlock) {
    btnRetryUnlock.onclick = async () => {
      state.lockLoading = true; state.lockMsg = null; render();
      try { await loadGalleryAll(); state.screen = 'gallery'; }
      catch (err) { state.lockMsg = err.message; }
      finally { state.lockLoading = false; render(); }
    };
  }

  // Upload screen
  const btnUpBack = document.getElementById('btn-upload-back');
  if (btnUpBack) {
    btnUpBack.onclick = async () => {
      state.screen = state.galleryLoaded ? 'gallery' : 'home';
      render();
      if (state.screen === 'gallery') {
        loadGalleryAll().catch(() => {});
      }
    };
  }
  const upFolder = document.getElementById('up-folder');
  if (upFolder) {
    upFolder.onchange = () => {
      const next = upFolder.value || null;
      if (next !== state.uploadTargetFolder) {
        state.uploadTargetFolder = next;
        // Jika tujuan folder diganti, catatan resume untuk folder lama tidak dipakai
        state.uploadQueue.forEach(q => { q.folder = next; });
      }
    };
  }
  const pickMedia = document.getElementById('btn-pick-media');
  if (pickMedia) {
    pickMedia.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.multiple = true; inp.accept = 'image/*,video/*';
      inp.onchange = () => addFilesToUploadQueue(inp.files);
      inp.click();
    };
  }
  const pickFiles = document.getElementById('btn-pick-files');
  if (pickFiles) {
    pickFiles.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.multiple = true;
      inp.onchange = () => addFilesToUploadQueue(inp.files);
      inp.click();
    };
  }
  const chkOff = document.getElementById('chk-up-off');
  if (chkOff) chkOff.onchange = () => { state.uploadAlsoOffline = chkOff.checked; };
  const chkFav = document.getElementById('chk-up-fav');
  if (chkFav) chkFav.onchange = () => { state.uploadAlsoFavorite = chkFav.checked; };
  const btnStartUp = document.getElementById('btn-start-upload');
  if (btnStartUp) btnStartUp.onclick = startUploadQueue;
  const btnPauseUp = document.getElementById('btn-pause-upload');
  if (btnPauseUp) {
    btnPauseUp.onclick = () => {
      state.uploadPaused = true;
      abortAllUploadXhrs();
      render();
    };
  }
  const btnResumeUp = document.getElementById('btn-resume-upload');
  if (btnResumeUp) btnResumeUp.onclick = startUploadQueue;
  const btnCancelUp = document.getElementById('btn-cancel-upload');
  if (btnCancelUp) {
    btnCancelUp.onclick = async () => {
      state.uploadCancelled = true;
      state.uploadPaused = false;
      abortAllUploadXhrs();
      await clearAllPendingBackupsForCurrentQueue();
      state.uploadQueue.forEach(q => { if (q.previewUrl) URL.revokeObjectURL(q.previewUrl); });
      state.uploadQueue = [];
      state.uploadRunning = false;
      render();
    };
  }
  const btnShowDups = document.getElementById('btn-show-dups');
  if (btnShowDups) {
    btnShowDups.onclick = () => {
      state.activeSheet = { type: 'dup-list', dups: state.uploadQueue.filter(q => q.dupInfo) };
      render();
    };
  }
  document.querySelectorAll('[data-repick-gal]').forEach(b => { b.onclick = () => reselectQueueItem(b.dataset.repickGal, false); });
  document.querySelectorAll('[data-repick-file]').forEach(b => { b.onclick = () => reselectQueueItem(b.dataset.repickFile, true); });
  document.querySelectorAll('[data-keep-dup]').forEach(b => {
    b.onclick = () => {
      const q = state.uploadQueue.find(x => x.id === b.dataset.keepDup);
      if (q) { q.allowDup = true; render(); }
    };
  });
  document.querySelectorAll('[data-rm-q]').forEach(b => {
    b.onclick = async () => {
      const q = state.uploadQueue.find(x => x.id === b.dataset.rmQ);
      if (q) {
        if (q.previewUrl) URL.revokeObjectURL(q.previewUrl);
        await deleteOpfsCopy(q);
        await deletePendingBackupBlob(q.id);
      }
      state.uploadQueue = state.uploadQueue.filter(x => x.id !== b.dataset.rmQ);
      render();
    };
  });

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = () => {
      state.currentTab = b.dataset.tab;
      state.selectMode = false; state.selectedPaths.clear();
      render();
    };
  });
  const btnTogOffPause = document.getElementById('btn-toggle-offline-pause');
  if (btnTogOffPause) btnTogOffPause.onclick = () => setOfflinePaused(!state.offlinePaused);

  // Gallery actions
  const btnRetryGal = document.getElementById('btn-retry-gallery');
  if (btnRetryGal) btnRetryGal.onclick = () => loadGalleryAll({ showSpinnerToast: true }).catch(() => {});
  const btnRefCol = document.getElementById('btn-refresh-col');
  if (btnRefCol) btnRefCol.onclick = () => loadGalleryAll({ showSpinnerToast: true }).catch(e => showToast(e.message, 'err'));
  const btnGoUp = document.getElementById('btn-go-upload');
  if (btnGoUp) btnGoUp.onclick = () => { state.uploadTargetFolder = state.currentFolder; state.screen = 'upload'; render(); };
  const btnUpFolder = document.getElementById('btn-folder-up');
  if (btnUpFolder) {
    btnUpFolder.onclick = () => {
      const segs = (state.currentFolder || '').split('/');
      segs.pop();
      state.currentFolder = segs.length ? segs.join('/') : null;
      state.selectMode = false; state.selectedPaths.clear();
      render();
    };
  }
  document.querySelectorAll('[data-nav-folder]').forEach(b => {
    b.onclick = () => { state.currentFolder = b.dataset.navFolder || null; state.selectMode = false; state.selectedPaths.clear(); render(); };
  });
  document.querySelectorAll('[data-open-folder]').forEach(b => {
    b.onclick = () => { state.currentFolder = b.dataset.openFolder; state.selectMode = false; state.selectedPaths.clear(); render(); };
  });

  const btnManageF = document.getElementById('btn-manage-folders');
  if (btnManageF) {
    btnManageF.onclick = () => {
      state.expandedMoveFolders = new Set();
      state.activeSheet = { type: 'folder-manage', query: '' };
      render();
    };
  }
  const btnNewSub = document.getElementById('btn-new-subfolder');
  if (btnNewSub) {
    btnNewSub.onclick = async () => {
      const name = prompt(`Buat sub-folder di dalam "${state.currentFolder}":`);
      if (!name) return;
      const full = state.currentFolder ? state.currentFolder + '/' + name.trim() : name.trim();
      try { await createRemoteFolder(full); showToast('Folder dibuat.', 'ok'); render(); }
      catch (e) { showToast(e.message, 'err'); }
    };
  }
  const btnDelFolder = document.getElementById('btn-del-folder');
  if (btnDelFolder) {
    btnDelFolder.onclick = () => {
      const cnt = Number(btnDelFolder.dataset.cnt || 0);
      state.activeSheet = { type: 'confirm-del-folder', folder: state.currentFolder, count: cnt };
      render();
    };
  }
  const btnShareFolder = document.getElementById('btn-share-folder');
  if (btnShareFolder) {
    btnShareFolder.onclick = () => {
      state.activeSheet = { type: 'share-create', targetType: 'folder', targetPath: state.currentFolder, label: 'Folder ' + state.currentFolder };
      render();
    };
  }

  // Foto / Video toggle
  document.querySelectorAll('[data-sec]').forEach(b => {
    b.onclick = () => {
      state.sectionByScope[getScopeKey()] = b.dataset.sec;
      state.selectMode = false; state.selectedPaths.clear();
      render();
    };
  });

  // Select mode
  const btnTogSel = document.getElementById('btn-toggle-select');
  if (btnTogSel) btnTogSel.onclick = () => { state.selectMode = !state.selectMode; state.selectedPaths.clear(); render(); };
  const btnSelAll = document.getElementById('btn-select-all');
  if (btnSelAll) {
    btnSelAll.onclick = () => {
      const curItems = state.allItems.filter(it => (it.folder || null) === (state.currentFolder || null));
      const photos = curItems.filter(x => x.type === 'photo');
      const videos = curItems.filter(x => x.type === 'video');
      const sec = getActiveSection(photos.length, videos.length);
      const shown = sec === 'video' ? videos : photos;
      shown.forEach(it => state.selectedPaths.add(it.path));
      render();
    };
  }
  const btnSelDups = document.getElementById('btn-select-dups');
  if (btnSelDups) {
    btnSelDups.onclick = () => {
      const curItems = state.allItems.filter(it => (it.folder || null) === (state.currentFolder || null));
      const photos = curItems.filter(x => x.type === 'photo');
      const videos = curItems.filter(x => x.type === 'video');
      const sec = getActiveSection(photos.length, videos.length);
      const shown = sec === 'video' ? videos : photos;
      const { extraDupPaths } = findDuplicateSetInList(shown);
      state.selectMode = true;
      state.selectedPaths = new Set(extraDupPaths);
      render();
    };
  }

  // Bulk actions in Koleksi
  const blkMove = document.getElementById('blk-move');
  if (blkMove) {
    blkMove.onclick = () => {
      state.expandedMoveFolders = new Set();
      state.activeSheet = { type: 'folder-move', paths: Array.from(state.selectedPaths), query: '' };
      render();
    };
  }
  const blkDel = document.getElementById('blk-del');
  if (blkDel) {
    blkDel.onclick = () => {
      const n = state.selectedPaths.size;
      if (!confirm(`Hapus ${n} item terpilih secara permanen?`)) return;
      executeBulkDelete(Array.from(state.selectedPaths));
    };
  }
  const blkOff = document.getElementById('blk-off');
  if (blkOff) {
    blkOff.onclick = async () => {
      const byPath = new Map(state.allItems.map(x => [x.path, x]));
      let ok = 0, fail = 0;
      for (const p of state.selectedPaths) {
        const it = byPath.get(p);
        if (!it) continue;
        try { await markItemOffline(it, { silent: true }); ok++; } catch (_) { fail++; }
      }
      state.selectMode = false; state.selectedPaths.clear();
      showToast(`Offline: ${ok} disimpan${fail ? ', ' + fail + ' gagal' : ''}.`, fail ? 'err' : 'ok');
      render();
    };
  }
  const blkFav = document.getElementById('blk-fav');
  if (blkFav) {
    blkFav.onclick = () => {
      const byPath = new Map(state.allItems.map(x => [x.path, x]));
      for (const p of state.selectedPaths) {
        const it = byPath.get(p);
        if (it && !state.favoriteMarks.has(p)) toggleFavoriteOptimistic(it);
      }
      state.selectMode = false; state.selectedPaths.clear();
      render();
    };
  }
  const blkShare = document.getElementById('blk-share');
  if (blkShare) {
    blkShare.onclick = () => {
      const p = Array.from(state.selectedPaths)[0];
      const it = state.allItems.find(x => x.path === p);
      if (it) {
        state.activeSheet = { type: 'share-create', targetType: 'file', targetPath: it.path, label: it.name };
        render();
      }
    };
  }

  // Offline tab buttons
  const offLocSel = document.getElementById('btn-off-loc-sel');
  if (offLocSel) offLocSel.onclick = () => { state.offlineLocalSelect = !state.offlineLocalSelect; state.offlineLocalSelected.clear(); render(); };
  const offLocAll = document.getElementById('btn-off-loc-all');
  if (offLocAll) offLocAll.onclick = () => { state.offlineLocalMap.forEach((_, p) => state.offlineLocalSelected.add(p)); render(); };
  const offRemSel = document.getElementById('btn-off-rem-sel');
  if (offRemSel) offRemSel.onclick = () => { state.offlineRemoteSelect = !state.offlineRemoteSelect; state.offlineRemoteSelected.clear(); render(); };
  const offRemAll = document.getElementById('btn-off-rem-all');
  if (offRemAll) offRemAll.onclick = () => {
    for (const p of state.offlineMarks.keys()) { if (!state.offlineLocalMap.has(p)) state.offlineRemoteSelected.add(p); }
    render();
  };
  const blkOffLocRm = document.getElementById('blk-off-loc-rm');
  if (blkOffLocRm) {
    blkOffLocRm.onclick = async () => {
      for (const p of Array.from(state.offlineLocalSelected)) await removeOfflineItem(p);
      state.offlineLocalSelect = false; state.offlineLocalSelected.clear();
      showToast('Dihapus dari penyimpanan offline.');
      render();
    };
  }
  const blkOffRemDl = document.getElementById('blk-off-rem-dl');
  if (blkOffRemDl) {
    blkOffRemDl.onclick = async () => {
      const byPath = new Map(state.allItems.map(x => [x.path, x]));
      const list = Array.from(state.offlineRemoteSelected).map(p => byPath.get(p)).filter(Boolean);
      state.offlineRemoteSelect = false; state.offlineRemoteSelected.clear();
      await downloadRemoteOfflineOneByOne(list);
    };
  }

  // Tile interactions (Fav, Offline, Share, Delete, Open Modal / Select)
  document.querySelectorAll('[data-fav-path]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const it = state.allItems.find(x => x.path === b.dataset.favPath);
      if (it) toggleFavoriteOptimistic(it);
    };
  });
  document.querySelectorAll('[data-item-offline]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const it = state.allItems.find(x => x.path === b.dataset.itemOffline);
      if (!it) return;
      b.disabled = true;
      try {
        if (state.offlineLocalMap.has(it.path) || state.offlineMarks.has(it.path)) {
          await removeOfflineItem(it.path);
          showToast('Dihapus dari offline.');
        } else {
          await markItemOffline(it);
        }
        render();
      } catch (err) {
        showToast(err.message, 'err');
      } finally { b.disabled = false; }
    };
  });
  document.querySelectorAll('[data-item-share]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const it = state.allItems.find(x => x.path === b.dataset.itemShare);
      if (it) { state.activeSheet = { type: 'share-create', targetType: 'file', targetPath: it.path, label: it.name }; render(); }
    };
  });
  document.querySelectorAll('[data-item-del]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const it = state.allItems.find(x => x.path === b.dataset.itemDel);
      if (!it) return;
      const lbl = it.type === 'video' ? 'video' : 'foto';
      if (!confirm(`Hapus ${lbl} ini?\n"${it.name}"`)) return;
      try { await deleteSingleItemAndSyncUi(it); }
      catch (err) { showToast('Gagal menghapus: ' + err.message, 'err'); }
    };
  });
  document.querySelectorAll('[data-open-path]').forEach(tile => {
    tile.onclick = () => {
      const p = tile.dataset.openPath;
      if (state.screen === 'share') {
        const files = normalizeShareFiles(state.shareData).filter(f => f.type === (state.shareSection === 'video' ? 'video' : 'photo'));
        if (state.shareSelectMode && !(state.shareData?.viewOnly || state.shareData?.view_only)) {
          if (state.shareSelected.has(p)) state.shareSelected.delete(p); else state.shareSelected.add(p);
          render();
          return;
        }
        const idx = Math.max(0, files.findIndex(f => f.relPath === p));
        openModal({ list: files, index: idx, mode: 'share', viewOnly: !!(state.shareData?.viewOnly || state.shareData?.view_only), shareId: state.shareId });
        return;
      }
      if (state.currentTab === 'offline') {
        const isLocalTile = tile.dataset.thumbKey.startsWith('offline::');
        if (isLocalTile && state.offlineLocalSelect) {
          if (state.offlineLocalSelected.has(p)) state.offlineLocalSelected.delete(p); else state.offlineLocalSelected.add(p);
          render(); return;
        }
        if (!isLocalTile && state.offlineRemoteSelect) {
          if (state.offlineRemoteSelected.has(p)) state.offlineRemoteSelected.delete(p); else state.offlineRemoteSelected.add(p);
          render(); return;
        }
        const byPath = new Map(state.allItems.map(x => [x.path, x]));
        const list = isLocalTile
          ? Array.from(state.offlineLocalMap.keys()).map(k => byPath.get(k) || { path: k, name: splitPath(k).name, type: isVideoName(k) ? 'video' : 'photo' })
          : Array.from(state.offlineMarks.keys()).filter(k => !state.offlineLocalMap.has(k) && byPath.has(k)).map(k => byPath.get(k));
        const idx = Math.max(0, list.findIndex(x => x.path === p));
        openModal({ list, index: idx, mode: isLocalTile ? 'offline' : 'gallery' });
        return;
      }
      if (state.selectMode) {
        if (state.selectedPaths.has(p)) state.selectedPaths.delete(p); else state.selectedPaths.add(p);
        render();
        return;
      }
      let list = [];
      if (state.currentTab === 'favorit') {
        const fav = getValidFavoriteItems();
        const photos = fav.filter(x => x.type === 'photo');
        const videos = fav.filter(x => x.type === 'video');
        list = getActiveSection(photos.length, videos.length) === 'video' ? videos : photos;
      } else {
        const cur = state.allItems.filter(it => (it.folder || null) === (state.currentFolder || null));
        const photos = cur.filter(x => x.type === 'photo');
        const videos = cur.filter(x => x.type === 'video');
        list = getActiveSection(photos.length, videos.length) === 'video' ? videos : photos;
      }
      const idx = Math.max(0, list.findIndex(x => x.path === p));
      openModal({ list, index: idx, mode: 'gallery' });
    };
  });

  // Public Share page bindings
  const btnRetryShare = document.getElementById('btn-retry-share');
  if (btnRetryShare) btnRetryShare.onclick = () => loadPublicShare(state.shareId, state.sharePath);
  const btnShareSingleDl = document.getElementById('btn-share-single-dl');
  if (btnShareSingleDl) {
    btnShareSingleDl.onclick = async () => {
      btnShareSingleDl.disabled = true;
      try { await downloadUrlWithProgress(btnShareSingleDl.dataset.url, btnShareSingleDl.dataset.name); }
      catch (e) { showToast(e.message, 'err'); }
      finally { btnShareSingleDl.disabled = false; }
    };
  }
  const singleCard = document.getElementById('share-single-card');
  if (singleCard && (state.shareData?.viewOnly || state.shareData?.view_only)) {
    singleCard.addEventListener('contextmenu', e => e.preventDefault());
    singleCard.addEventListener('dragstart', e => e.preventDefault());
  }
  document.querySelectorAll('[data-share-path]').forEach(b => {
    b.onclick = () => { state.shareSelectMode = false; state.shareSelected.clear(); loadPublicShare(state.shareId, b.dataset.sharePath); };
  });
  document.querySelectorAll('[data-share-sec]').forEach(b => {
    b.onclick = () => { state.shareSection = b.dataset.shareSec; state.shareSelectMode = false; state.shareSelected.clear(); render(); };
  });
  const btnShareSel = document.getElementById('btn-share-sel');
  if (btnShareSel) btnShareSel.onclick = () => { state.shareSelectMode = !state.shareSelectMode; state.shareSelected.clear(); render(); };
  const btnShareDlSel = document.getElementById('btn-share-dl-sel');
  if (btnShareDlSel) {
    btnShareDlSel.onclick = async () => {
      btnShareDlSel.disabled = true;
      for (const rel of Array.from(state.shareSelected)) {
        try { await downloadUrlWithProgress(shareRawUrl(state.shareId, rel), splitPath(rel).name); }
        catch (e) { showToast('Gagal unduh ' + splitPath(rel).name + ': ' + e.message, 'err'); }
      }
      state.shareSelectMode = false; state.shareSelected.clear();
      render();
    };
  }

  // Sheet bindings
  const sheetBd = document.getElementById('sheet-backdrop');
  if (sheetBd) sheetBd.onclick = (e) => { if (e.target === sheetBd) { state.activeSheet = null; render(); } };
  const sheetClose = document.getElementById('sheet-close');
  if (sheetClose) sheetClose.onclick = () => { state.activeSheet = null; render(); };

  const fSearch = document.getElementById('sheet-folder-search');
  if (fSearch) {
    fSearch.oninput = () => {
      state.activeSheet.query = fSearch.value;
      const pos = fSearch.selectionStart;
      render();
      const inp2 = document.getElementById('sheet-folder-search');
      if (inp2) { inp2.focus(); inp2.setSelectionRange(pos, pos); }
    };
  }
  document.querySelectorAll('[data-tree-toggle]').forEach(b => {
    b.onclick = () => {
      const sb = document.getElementById('sheet-scroll-body');
      const st = sb ? sb.scrollTop : 0;
      const f = b.dataset.treeToggle;
      if (state.expandedMoveFolders.has(f)) state.expandedMoveFolders.delete(f);
      else state.expandedMoveFolders.add(f);
      render();
      const sb2 = document.getElementById('sheet-scroll-body');
      if (sb2) sb2.scrollTop = st;
    };
  });
  document.querySelectorAll('[data-tree-pick]').forEach(b => {
    b.onclick = () => {
      const dest = b.dataset.treePick || null;
      if (state.activeSheet?.type === 'folder-move') {
        executeMoveItems(state.activeSheet.paths, dest);
      } else {
        state.currentFolder = dest;
        state.activeSheet = null;
        state.selectMode = false; state.selectedPaths.clear();
        render();
      }
    };
  });
  const btnSheetCreateF = document.getElementById('sheet-create-folder');
  if (btnSheetCreateF) {
    btnSheetCreateF.onclick = async () => {
      const name = (document.getElementById('sheet-new-folder-name')?.value || '').trim();
      if (!name) return;
      try {
        await createRemoteFolder(name);
        showToast('Folder dibuat: ' + name, 'ok');
        render();
      } catch (e) { showToast(e.message, 'err'); }
    };
  }
  document.querySelectorAll('[data-sheet-keep-dup]').forEach(b => {
    b.onclick = () => {
      const q = state.uploadQueue.find(x => x.id === b.dataset.sheetKeepDup);
      if (q) { q.allowDup = !q.allowDup; render(); }
    };
  });
  const btnRmAllDups = document.getElementById('sheet-rm-all-dups');
  if (btnRmAllDups) {
    btnRmAllDups.onclick = async () => {
      const toRm = state.uploadQueue.filter(q => q.dupInfo && !q.allowDup);
      for (const q of toRm) {
        if (q.previewUrl) URL.revokeObjectURL(q.previewUrl);
        await deleteOpfsCopy(q);
        await deletePendingBackupBlob(q.id);
      }
      state.uploadQueue = state.uploadQueue.filter(q => !(q.dupInfo && !q.allowDup));
      state.activeSheet = null;
      render();
    };
  }
  const btnMkDl = document.getElementById('btn-mk-share-dl');
  const btnMkVo = document.getElementById('btn-mk-share-vo');
  const runCreateShare = async (vo) => {
    if (btnMkDl) btnMkDl.disabled = true;
    if (btnMkVo) btnMkVo.disabled = true;
    try {
      const sid = await createShareLink(state.activeSheet.targetType, state.activeSheet.targetPath, vo);
      state.activeSheet.shareId = sid;
      state.activeSheet.err = null;
    } catch (e) {
      state.activeSheet.err = e.message;
    }
    render();
  };
  if (btnMkDl) btnMkDl.onclick = () => runCreateShare(false);
  if (btnMkVo) btnMkVo.onclick = () => runCreateShare(true);
  const btnCopyShare = document.getElementById('btn-copy-share');
  if (btnCopyShare) {
    btnCopyShare.onclick = async () => {
      const val = document.getElementById('share-url-box')?.value || '';
      try { await navigator.clipboard.writeText(val); } catch (_) {}
      btnCopyShare.textContent = 'Tersalin';
      showToast('Link disalin ke clipboard.', 'ok');
    };
  }
  const btnRevokeShare = document.getElementById('btn-revoke-share');
  if (btnRevokeShare) {
    btnRevokeShare.onclick = async () => {
      if (!confirm('Cabut link berbagi ini?')) return;
      try {
        await revokeShareLink(state.activeSheet.shareId);
        state.activeSheet = null;
        showToast('Link berbagi dicabut.', 'ok');
        render();
      } catch (e) { showToast(e.message, 'err'); }
    };
  }
  const btnCancelDelF = document.getElementById('sheet-cancel-del-folder');
  if (btnCancelDelF) btnCancelDelF.onclick = () => { state.activeSheet = null; render(); };
  const btnConfDelF = document.getElementById('sheet-confirm-del-folder');
  if (btnConfDelF) {
    btnConfDelF.onclick = async () => {
      const folderToDel = state.activeSheet.folder;
      btnConfDelF.disabled = true;
      btnConfDelF.textContent = 'Menghapus…';
      try {
        await deleteRemoteFolder(folderToDel);
        const prefix = folderToDel + '/';
        for (const it of state.allItems) {
          if (it.folder === folderToDel || (it.folder && it.folder.startsWith(prefix))) {
            await deleteOfflineBlob(it.path);
            state.offlineMarks.delete(it.path);
            state.favoriteMarks.delete(it.path);
          }
        }
        state.activeSheet = null;
        state.currentFolder = null;
        await loadGalleryAll();
        showToast('Folder & seluruh isinya dihapus.', 'ok');
      } catch (e) {
        showToast(e.message, 'err');
        btnConfDelF.disabled = false;
        render();
      }
    };
  }
}

/* ==================== BOOTSTRAP ==================== */
(async function boot() {
  cleanupOpfsOrphans().catch(() => {});
  const params = new URLSearchParams(location.search);
  const shareParam = params.get('share');
  if (shareParam) {
    state.shareId = shareParam;
    state.screen = 'share';
    render();
    await loadPublicShare(shareParam, params.get('path') || '');
    return;
  }
  ensureWorkerBase().catch(() => {});
  render();
})();
})();
</script>
</body>
</html>
