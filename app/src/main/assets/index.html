async function savePendingBackupBlob(id, file, meta) {
  if (!('caches' in window) || !file || file.size > MAX_LOCAL_BACKUP_BYTES) return;
  try {
    const cache = await caches.open(UPLOAD_CACHE_NAME);
    const url = 'https://brankas-pending.local/' + encodeURIComponent(getUserId()) + '/' + encodeURIComponent(id);
    await cache.put(new Request(url), new Response(file, {
      headers: {
        'Content-Type': file.type || 'application/octet-stream',
        'X-Pending-Meta': encodeURIComponent(JSON.stringify(meta))
      }
    }));
  } catch (_) {}
}

async function deletePendingBackupBlob(id) {
  if (!('caches' in window)) return;
  try {
    const cache = await caches.open(UPLOAD_CACHE_NAME);
    const url = 'https://brankas-pending.local/' + encodeURIComponent(getUserId()) + '/' + encodeURIComponent(id);
    await cache.delete(new Request(url));
  } catch (_) {}
}

async function clearAllPendingBackupsForCurrentQueue() {
  for (const q of state.uploadQueue) {
    await deletePendingBackupBlob(q.id);
    clearResumeRecord(resumeKeyFor(q, q.folder ?? state.uploadTargetFolder));
    await deleteOpfsCopy(q);
  }
}

async function resumePendingUploadsFromBackup() {
  if (!('caches' in window) || !getUserId() || state.uploadRunning) return;
  try {
    const cache = await caches.open(UPLOAD_CACHE_NAME);
    const keys = await cache.keys();
    const prefix = 'https://brankas-pending.local/' + encodeURIComponent(getUserId()) + '/';
    const pendingItems = [];
    for (const req of keys) {
      if (!req.url.startsWith(prefix)) continue;
      const id = decodeURIComponent(req.url.slice(prefix.length));
      if (state.activeUploadIds.has(id)) continue;
      const resp = await cache.match(req);
      const rawMeta = resp?.headers?.get('X-Pending-Meta');
      if (!resp || !rawMeta) { await cache.delete(req); continue; }
      const meta = JSON.parse(decodeURIComponent(rawMeta));
      if (meta.size > MAX_LOCAL_BACKUP_BYTES) { await cache.delete(req); continue; }
      const blob = await resp.blob();
      const file = new File([blob], meta.name, { type: meta.mime || blob.type, lastModified: meta.lastModified || Date.now() });
      pendingItems.push({ id, file, meta });
    }
    if (!pendingItems.length) return;
    showToast('Melanjutkan unggahan tertunda…');
    for (const p of pendingItems) {
      if (state.activeUploadIds.has(p.id)) continue;
      state.activeUploadIds.add(p.id);
      const qItem = {
        id: p.id,
        file: p.file,
        opfsName: null,
        opfsFile: null,
        name: p.meta.name,
        size: p.file.size,
        lastModified: p.meta.lastModified || 0,
        type: isVideoName(p.meta.name) ? 'video' : 'photo',
        folder: p.meta.folder ?? null,
        previewUrl: null,
        status: 'queued',
        progressText: 'Melanjutkan unggahan tertunda…',
        pct: 0,
        dupInfo: null,
        allowDup: true,
        unreadable: false
      };
      try {
        await uploadSingleQueueItem(qItem, qItem.folder, { isBackgroundResume: true });
        await deletePendingBackupBlob(p.id);
      } catch (_) {
        // Akan dicoba lagi pada sesi berikutnya
      } finally {
        state.activeUploadIds.delete(p.id);
      }
    }
    const { items, explicitFolders } = await storageList().catch(() => ({ items: state.allItems, explicitFolders: state.explicitFolders }));
    state.allItems = items;
    state.explicitFolders = explicitFolders;
    state.allFolders = buildAllFolders(items, explicitFolders);
    if (state.screen === 'gallery') render();
  } catch (_) {}
}

function startQueueKeepAlive() {
  if (state.uploadKeepAliveTimer) clearInterval(state.uploadKeepAliveTimer);
  state.uploadKeepAliveTimer = setInterval(async () => {
    for (const q of state.uploadQueue) {
      if (q.status === 'done' || q.unreadable) continue;
      const src = q.opfsFile || q.file;
      if (src) {
        const ok = await checkFileReadable(src);
        if (!ok) {
          q.unreadable = true;
          q.status = 'error';
          q.progressText = 'File tidak terbaca lagi oleh HP. Pilih ulang file.';
          render();
        }
      }
    }
  }, 15000);
}

async function addFilesToUploadQueue(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const newItems = [];
  for (const file of files) {
    const id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const ok = await checkFileReadable(file);
    const previewUrl = ok && !isVideoName(file.name) ? URL.createObjectURL(file) : null;
    const qItem = {
      id,
      file,
      opfsName: null,
      opfsFile: null,
      name: file.name || ('media_' + Date.now() + '.jpg'),
      size: file.size,
      lastModified: file.lastModified || 0,
      type: isVideoName(file.name) ? 'video' : 'photo',
      folder: state.uploadTargetFolder,
      previewUrl,
      status: ok ? 'copying' : 'error',
      progressText: ok ? 'Menyalin ke penyimpanan sementara HP… 0%' : 'File gagal dibaca (NotReadableError). Pilih ulang.',
      pct: 0,
      dupInfo: null,
      allowDup: false,
      unreadable: !ok,
      fp: null
    };
    newItems.push(qItem);
  }
  // Selalu TAMBAHKAN ke antrean (concat), jangan pernah menimpa
  state.uploadQueue = state.uploadQueue.concat(newItems);
  startQueueKeepAlive();
  render();

  for (const qItem of newItems) {
    if (!qItem.unreadable) {
      await copyFileToOpfs(qItem);
      const src = qItem.opfsFile || qItem.file;
      try {
        qItem.fp = await computeFingerprint(src);
      } catch (_) {}
      if (qItem.status === 'copying') qItem.status = 'queued';
    }
  }
  await detectDuplicatesInQueue();
  render();
}

async function reselectQueueItem(id, viaFiles) {
  const inp = document.createElement('input');
  inp.type = 'file';
  if (!viaFiles) inp.accept = 'image/*,video/*';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const idx = state.uploadQueue.findIndex(x => x.id === id);
    if (idx === -1) return;
    const q = state.uploadQueue[idx];
    if (q.previewUrl) URL.revokeObjectURL(q.previewUrl);
    await deleteOpfsCopy(q);
    q.file = f;
    q.name = f.name;
    q.size = f.size;
    q.lastModified = f.lastModified || 0;
    q.type = isVideoName(f.name) ? 'video' : 'photo';
    q.unreadable = !(await checkFileReadable(f));
    q.previewUrl = !q.unreadable && q.type === 'photo' ? URL.createObjectURL(f) : null;
    q.status = q.unreadable ? 'error' : 'copying';
    q.progressText = q.unreadable ? 'Masih tidak bisa dibaca.' : 'Menyalin ke penyimpanan sementara HP… 0%';
    render();
    if (!q.unreadable) {
      await copyFileToOpfs(q);
      try { q.fp = await computeFingerprint(q.opfsFile || q.file); } catch (_) {}
      q.status = 'queued';
      await detectDuplicatesInQueue();
      render();
    }
  };
  inp.click();
}

async function detectDuplicatesInQueue({ showPopupIfFound = false } = {}) {
  if (!state.uploadQueue.length) return [];
  // Pastikan daftar seluruh brankas (SEMUA folder) sudah dimuat dulu
  if (!state.galleryLoaded) {
    try {
      const { items, explicitFolders } = await storageList();
      state.allItems = items;
      state.explicitFolders = explicitFolders;
      state.allFolders = buildAllFolders(items, explicitFolders);
      state.galleryLoaded = true;
    } catch (_) {}
  }
  // Lengkapi sidik jari file lama yang belum punya fp lewat /fingerprint
  const missingFpNames = state.allItems.filter(it => !it.fp).map(it => it.path);
  if (missingFpNames.length) {
    const fps = await fetchFingerprintsBatch(missingFpNames);
    for (const it of state.allItems) {
      if (fps[it.path]) it.fp = fps[it.path];
    }
  }
  const fpMap = new Map(); // fp -> [vaultItem]
  for (const it of state.allItems) {
    if (it.fp) {
      if (!fpMap.has(it.fp)) fpMap.set(it.fp, []);
      fpMap.get(it.fp).push(it);
    }
  }
  const queueSeenFp = new Map();
  const foundDups = [];
  for (const q of state.uploadQueue) {
    if (q.status === 'done' || q.unreadable) continue;
    if (!q.fp) {
      try { q.fp = await computeFingerprint(q.opfsFile || q.file); } catch (_) {}
    }
    if (!q.fp) continue;
    const vaultMatches = fpMap.get(q.fp) || [];
    if (vaultMatches.length > 0) {
      const locList = vaultMatches.map(v => v.folder ? `sudah ada di folder “${v.folder}”` : 'sudah ada di luar folder (Koleksimu)');
      q.dupInfo = Array.from(new Set(locList)).join(', ');
      foundDups.push(q);
    } else if (queueSeenFp.has(q.fp)) {
      q.dupInfo = 'sama dengan file lain di antrean (' + queueSeenFp.get(q.fp).name + ')';
      foundDups.push(q);
    } else {
      q.dupInfo = null;
      queueSeenFp.set(q.fp, q);
    }
  }
  if (showPopupIfFound && foundDups.length) {
    state.activeSheet = { type: 'dup-list', dups: foundDups };
  }
  return foundDups;
}

function ensureUniqueTargetKey(folder, origName, existingSet) {
  const full = folder ? `${folder}/${origName}` : origName;
  if (!existingSet.has(full)) {
    existingSet.add(full);
    return full;
  }
  const dot = origName.lastIndexOf('.');
  const base = dot === -1 ? origName : origName.slice(0, dot);
  const ext = dot === -1 ? '' : origName.slice(dot);
  let n = 2;
  while (true) {
    const candName = `${base} (${n})${ext}`;
    const candFull = folder ? `${folder}/${candName}` : candName;
    if (!existingSet.has(candFull)) {
      existingSet.add(candFull);
      return candFull;
    }
    n++;
  }
}

function abortAllUploadXhrs() {
  for (const xhr of Array.from(state.activeUploadXhrs)) {
    try { xhr.abort(); } catch (_) {}
  }
  state.activeUploadXhrs.clear();
}

function uploadPartWithXhr({ url, blob, token, onProgress, stallMs = 45000 }) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    state.activeUploadXhrs.add(xhr);
    let lastActivity = Date.now();
    const stallChecker = setInterval(() => {
      if (Date.now() - lastActivity > stallMs) {
        clearInterval(stallChecker);
        try { xhr.abort(); } catch (_) {}
        reject(new Error('Macet > 45 detik'));
      }
    }, 3000);
    const cleanup = () => {
      clearInterval(stallChecker);
      state.activeUploadXhrs.delete(xhr);
    };
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.upload.onprogress = (e) => {
      lastActivity = Date.now();
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      cleanup();
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const j = JSON.parse(xhr.responseText || '{}');
          if (!j.etag) return reject(new Error('Server tidak mengembalikan ETag bagian.'));
          resolve(j.etag);
        } catch (_) {
          reject(new Error('Respon bagian tidak valid.'));
        }
      } else {
        const err = new Error('HTTP ' + xhr.status);
        err.status = xhr.status;
        reject(err);
      }
    };
    xhr.onerror = () => { cleanup(); reject(new Error('Koneksi terputus saat mengunggah bagian')); };
    xhr.onabort = () => { cleanup(); reject(new Error('ABORTED')); };
    xhr.send(blob);
  });
}

async function uploadSingleQueueItem(qItem, targetFolder, { isBackgroundResume = false } = {}) {
  const uid = getUserId();
  const srcFile = qItem.opfsFile || qItem.file;
  const rKey = resumeKeyFor(qItem, targetFolder);
  let rec = readResumeRecord(rKey);

  // Jangan menimpa file yang sudah ada di brankas
  let targetKey = rec?.targetKey;
  if (!targetKey) {
    const existingSet = new Set(state.allItems.map(it => it.path));
    targetKey = ensureUniqueTargetKey(targetFolder, qItem.name, existingSet);
  }
  qItem.targetKey = targetKey;

  const totalParts = Math.max(1, Math.ceil(srcFile.size / CHUNK_SIZE));
  const fp = qItem.fp || await computeFingerprint(srcFile).catch(() => '');
  qItem.fp = fp;

  if (!rec || rec.targetKey !== targetKey || rec.totalParts !== totalParts) {
    // Init multipart upload (timeout 30s + retry)
    let uploadId = null;
    for (let t = 0; t < 3; t++) {
      await refreshSession(false);
      const base = await ensureWorkerBase();
      const headers = {};
      if (fp) headers['X-Fingerprint'] = fp;
      if (!qItem.allowDup) headers['X-Check-Dup'] = '1';
      const res = await workerAuthFetch(`/upload/init/${encodeURIComponent(uid)}/${encodePath(targetKey)}`, {
        method: 'POST',
        headers
      }, 30000);
      if (res.status === 409) {
        throw new Error('DOBEL_409');
      }
      if (res.ok) {
        const j = await res.json();
        uploadId = j.uploadId;
        break;
      }
      if (t < 2) await sleep(1000 * (t + 1));
      else throw new Error('Gagal memulai unggahan (init HTTP ' + res.status + ').');
    }
    rec = { uploadId, targetKey, totalParts, parts: {} };
    writeResumeRecord(rKey, rec);
  }

  // Backup <= 50MB agar bisa dilanjutkan jika tertutup
  if (!isBackgroundResume && qItem.size <= MAX_LOCAL_BACKUP_BYTES) {
    await savePendingBackupBlob(qItem.id, srcFile, {
      name: qItem.name,
      size: qItem.size,
      lastModified: qItem.lastModified,
      folder: targetFolder,
      mime: qItem.file.type
    });
  }

  const partLoaded = new Map();
  let completedBytesBase = 0;
  for (let p = 1; p <= totalParts; p++) {
    if (rec.parts[p]) {
      const pStart = (p - 1) * CHUNK_SIZE;
      const pEnd = Math.min(srcFile.size, p * CHUNK_SIZE);
      completedBytesBase += (pEnd - pStart);
    }
  }
  const startTime = Date.now();
  let lastUiUpdate = 0;

  const updateProgressUi = (activePartNum) => {
    const now = Date.now();
    if (now - lastUiUpdate < 160) return;
    lastUiUpdate = now;
    let inFlight = 0;
    for (const v of partLoaded.values()) inFlight += v;
    const totalDone = Math.min(srcFile.size, completedBytesBase + inFlight);
    const pct = srcFile.size ? Math.round((totalDone / srcFile.size) * 100) : 100;
    const elapsedSec = Math.max(0.5, (now - startTime) / 1000);
    const sessionBytes = Math.max(0, totalDone - completedBytesBase);
    const speed = sessionBytes / elapsedSec;
    const remSec = speed > 100 ? (srcFile.size - totalDone) / speed : 0;
    const speedTxt = speed > 0 ? formatBytes(speed) + '/dtk' : 'menghitung…';
    const donePartsCount = Object.keys(rec.parts).length + (activePartNum ? 1 : 0);
    const txt = `${pct}% · ${speedTxt} · sisa ${formatEta(remSec)} (bagian ${Math.min(totalParts, donePartsCount)}/${totalParts})`;
    qItem.pct = pct;
    qItem.progressText = txt;
    setLiveText(`q-status-${qItem.id}`, txt);
    setLiveWidth(`q-bar-${qItem.id}`, pct);
  };

  const pendingPartNums = [];
  for (let p = 1; p <= totalParts; p++) {
    if (!rec.parts[p]) pendingPartNums.push(p);
  }

  let cursor = 0;
  let fatalErr = null;

  async function workerSlot() {
    while (!fatalErr && !state.uploadPaused && !state.uploadCancelled) {
      const idx = cursor++;
      if (idx >= pendingPartNums.length) break;
      const partNumber = pendingPartNums[idx];
      const start = (partNumber - 1) * CHUNK_SIZE;
      const end = Math.min(srcFile.size, partNumber * CHUNK_SIZE);
      const blob = srcFile.slice(start, end);
      let partOk = false;
      let pErr = null;
      for (let attempt = 0; attempt < 4; attempt++) {
        if (state.uploadPaused || state.uploadCancelled) return;
        try {
          await refreshSession(false);
          const base = await ensureWorkerBase();
          const token = state.session?.access_token || '';
          const url = `${base}/upload/part/${encodeURIComponent(uid)}/${encodePath(targetKey)}?uploadId=${encodeURIComponent(rec.uploadId)}&partNumber=${partNumber}`;
          const etag = await uploadPartWithXhr({
            url,
            blob,
            token,
            onProgress: (loaded) => {
              partLoaded.set(partNumber, loaded);
              updateProgressUi(partNumber);
            }
          });
          partLoaded.delete(partNumber);
          completedBytesBase += (end - start);
          rec.parts[partNumber] = etag;
          writeResumeRecord(rKey, rec);
          updateProgressUi(partNumber);
          partOk = true;
          break;
        } catch (e) {
          partLoaded.delete(partNumber);
          if (e.message === 'ABORTED' && (state.uploadPaused || state.uploadCancelled)) return;
          if (e.status === 401) await refreshSession(true);
          pErr = e;
          if (attempt < 3) await sleep(900 * (attempt + 1));
        }
      }
      if (!partOk) {
        fatalErr = pErr || new Error('Gagal mengunggah bagian ' + partNumber);
        break;
      }
    }
  }

  await Promise.all(Array.from({ length: PART_CONCURRENCY }, () => workerSlot()));

  if (state.uploadCancelled) {
    await workerAuthFetch(`/upload/abort/${encodeURIComponent(uid)}/${encodePath(targetKey)}?uploadId=${encodeURIComponent(rec.uploadId)}`, { method: 'POST' }, 10000).catch(() => {});
    clearResumeRecord(rKey);
    throw new Error('CANCELLED');
  }
  if (state.uploadPaused) {
    throw new Error('PAUSED');
  }
  if (fatalErr) throw fatalErr;

  // JANGAN pernah complete jika ada bagian yang bolong!
  const partsArray = [];
  for (let p = 1; p <= totalParts; p++) {
    if (!rec.parts[p]) {
      throw new Error('Ada bagian yang belum lengkap (' + p + '/' + totalParts + ').');
    }
    partsArray.push({ partNumber: p, etag: rec.parts[p] });
  }

  // Complete multipart (timeout 60s + retry)
  let completed = false;
  let compErr = null;
  for (let c = 0; c < 3; c++) {
    try {
      await refreshSession(false);
      const res = await workerAuthFetch(`/upload/complete/${encodeURIComponent(uid)}/${encodePath(targetKey)}?uploadId=${encodeURIComponent(rec.uploadId)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          parts: partsArray,
          contentType: qItem.file.type || 'application/octet-stream'
        })
      }, 60000);
      if (res.status === 409) throw new Error('DOBEL_409');
      if (res.ok) { completed = true; break; }
      compErr = new Error('Complete HTTP ' + res.status);
    } catch (e) {
      if (e.message === 'DOBEL_409') throw e;
      compErr = e;
    }
    if (c < 2) await sleep(1200 * (c + 1));
  }
  if (!completed) throw compErr || new Error('Gagal menyelesaikan unggahan (complete).');

  clearResumeRecord(rKey);
  await deletePendingBackupBlob(qItem.id);
  await deleteOpfsCopy(qItem);
  return targetKey;
}

async function diagnoseUploadError(errMsg) {
  try {
    const res = await fetchT(state.workerBase + '/ping', { method: 'GET', cache: 'no-store' }, 5000);
    if (res.ok) {
      return `Server terjangkau (/ping OK), tetapi potongan besar terputus di jaringan Anda (${errMsg}).`;
    }
  } catch (_) {}
  return `Server tidak terjangkau (${errMsg}). Periksa koneksi internet Anda.`;
}

async function startUploadQueue() {
  if (state.uploadRunning) return;
  const runnable = state.uploadQueue.filter(q => q.status !== 'done' && !q.unreadable);
  if (!runnable.length) {
    showToast('Tidak ada file valid untuk diunggah.', 'err');
    return;
  }
  const btn = document.getElementById('btn-start-upload');
  if (btn) btn.disabled = true;

  // Cek dobel sebelum mulai
  const dups = await detectDuplicatesInQueue({ showPopupIfFound: false });
  const blockingDups = dups.filter(d => !d.allowDup);
  if (blockingDups.length > 0) {
    const ok = confirm(`Ditemukan ${blockingDups.length} file dobel persis di antrean.\n\nOK = Lewati yang dobel dan unggah sisanya.\nBatal = Kembali untuk meninjau daftar.`);
    if (!ok) {
      if (btn) btn.disabled = false;
      state.activeSheet = { type: 'dup-list', dups: blockingDups };
      render();
      return;
    }
    for (const d of blockingDups) {
      d.status = 'skipped';
      d.progressText = 'Dilewati (dobel)';
    }
  }

  state.uploadRunning = true;
  state.uploadPaused = false;
  state.uploadCancelled = false;
  state.uploadSummary = '';
  render();

  const uploadedKeys = [];
  const failedItems = [];
  let diagNote = '';

  for (const qItem of state.uploadQueue) {
    if (state.uploadCancelled) break;
    if (state.uploadPaused) break;
    if (qItem.status === 'done' || qItem.status === 'skipped' || qItem.unreadable) continue;
    qItem.folder = state.uploadTargetFolder;
    qItem.status = 'uploading';
    state.activeUploadIds.add(qItem.id);
    setLiveText(`q-status-${qItem.id}`, 'Memulai unggahan…');

    let fileSuccess = false;
    let lastErr = null;
    // Percobaan ulang seluruh file sampai 2x
    for (let fTry = 0; fTry < 2; fTry++) {
      if (state.uploadPaused || state.uploadCancelled) break;
      try {
        const savedKey = await uploadSingleQueueItem(qItem, state.uploadTargetFolder);
        qItem.status = 'done';
        qItem.pct = 100;
        qItem.progressText = 'Selesai diunggah';
        setLiveText(`q-status-${qItem.id}`, 'Selesai diunggah');
        setLiveWidth(`q-bar-${qItem.id}`, 100);
        uploadedKeys.push({ path: savedKey, name: splitPath(savedKey).name });
        fileSuccess = true;
        break;
      } catch (e) {
        lastErr = e;
        if (e.message === 'PAUSED' || e.message === 'CANCELLED') break;
        if (e.message === 'DOBEL_409') {
          qItem.status = 'skipped';
          qItem.dupInfo = 'Ditolak server (409: isi file sudah ada di brankas)';
          qItem.progressText = 'Dilewati (dobel di server)';
          break;
        }
        if (fTry === 0) await sleep(1200);
      }
    }

    state.activeUploadIds.delete(qItem.id);
    if (state.uploadPaused || state.uploadCancelled) break;
    if (!fileSuccess && qItem.status !== 'skipped') {
      qItem.status = 'error';
      diagNote = await diagnoseUploadError(lastErr?.message || 'gagal');
      qItem.progressText = 'Gagal: ' + (lastErr?.message || 'error');
      failedItems.push(qItem.name);
    }
  }

  state.uploadRunning = false;

  if (state.uploadCancelled) {
    await clearAllPendingBackupsForCurrentQueue();
    state.uploadSummary = 'Unggahan dibatalkan dan cadangan sementara dibersihkan.';
    render();
    return;
  }
  if (state.uploadPaused) {
    state.uploadSummary = 'Unggahan dijeda. Anda bisa menambah file atau menekan Lanjutkan.';
    render();
    return;
  }

  // Muat ulang daftar galeri dari server SEBELUM menjalankan offline/favorit (agar file baru tidak dianggap hantu!)
  if (uploadedKeys.length > 0) {
    try {
      const { items, explicitFolders } = await storageList();
      state.allItems = items;
      state.explicitFolders = explicitFolders;
      state.allFolders = buildAllFolders(items, explicitFolders);
      state.galleryLoaded = true;
    } catch (_) {}

    const byPath = new Map(state.allItems.map(it => [it.path, it]));
    for (const uk of uploadedKeys) {
      const it = byPath.get(uk.path) || { path: uk.path, name: uk.name, type: isVideoName(uk.name) ? 'video' : 'photo' };
      if (state.uploadAlsoFavorite) {
        try {
          await upsertFavoriteMarkRemote(it.path, it.name);
          state.favoriteMarks.set(it.path, { path: it.path, name: it.name, created_at: new Date().toISOString() });
        } catch (_) {
          pushPendingMark({ kind: 'fav_add', path: it.path, name: it.name });
        }
      }
      if (state.uploadAlsoOffline) {
        try {
          await markItemOffline(it, { silent: true });
        } catch (e) {
          showToast(e.message, 'err');
        }
      }
    }
  }

  state.uploadSummary = `Selesai: ${uploadedKeys.length} berhasil` +
    (failedItems.length ? `, ${failedItems.length} gagal (${failedItems.join(', ')}). ${diagNote}` : '.');
  render();
}

async function createShareLink(type, path, viewOnly) {
  const uid = getUserId();
  const res = await workerAuthFetch(`/share/${encodeURIComponent(uid)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, path, ...(viewOnly ? { viewOnly: true } : {}) })
  }, 20000);
  const txt = await res.text();
  let j = {};
  try { j = JSON.parse(txt); } catch (_) {}
  if (!res.ok) {
    if (viewOnly && /view_only|column/i.test(txt)) {
      throw new Error('Kolom shares.view_only belum ada di database. Jalankan SQL:\nalter table shares add column if not exists view_only boolean not null default false;');
    }
    throw new Error(j.error || 'Gagal membuat link berbagi (' + res.status + ').');
  }
  return j.id;
}

async function listMyShares() {
  const uid = getUserId();
  const res = await workerAuthFetch(`/share/list/${encodeURIComponent(uid)}`, { method: 'GET' }, 15000);
  if (!res.ok) return [];
  const j = await res.json().catch(() => ({}));
  return Array.isArray(j) ? j : (j.shares || []);
}

async function revokeShareLink(shareId) {
  const uid = getUserId();
  const res = await workerAuthFetch(`/share/${encodeURIComponent(uid)}/${encodeURIComponent(shareId)}`, { method: 'DELETE' }, 15000);
  if (!res.ok) throw new Error('Gagal mencabut link (' + res.status + ').');
}

function buildPublicShareUrl(shareId) {
  const base = location.origin.startsWith('http') ? location.origin + location.pathname : location.href.split('?')[0];
  return base + '?share=' + encodeURIComponent(shareId);
}

async function loadPublicShare(shareId, subPath = '') {
  state.shareLoading = true;
  state.shareError = null;
  state.sharePath = subPath;
  if (location.protocol.startsWith('http')) {
    const u = new URL(location.href);
    u.searchParams.set('share', shareId);
    if (subPath) u.searchParams.set('path', subPath);
    else u.searchParams.delete('path');
    history.replaceState(null, '', u.toString());
  }
  render();
  try {
    const base = await ensureWorkerBase();
    const qs = subPath ? '?path=' + encodeURIComponent(subPath) : '';
    const res = await netGet(() => ({
      url: `${base}/share/${encodeURIComponent(shareId)}${qs}`,
      opts: { method: 'GET' }
    }), { timeout: 15000, tries: 3, onAuthRefresh: false });
    if (!res.ok) throw new Error(res.status === 404 ? 'Link berbagi tidak ditemukan atau sudah dicabut.' : 'Gagal memuat link berbagi (' + res.status + ').');
    const data = await res.json();
    state.shareData = data;
    // Tentukan default tab Foto/Video
    const files = normalizeShareFiles(data);
    const photos = files.filter(f => f.type === 'photo');
    const videos = files.filter(f => f.type === 'video');
    if (photos.length === 0 && videos.length > 0) state.shareSection = 'video';
    else state.shareSection = 'photo';
  } catch (e) {
    state.shareError = e.message || 'Gagal terhubung ke server.';
  } finally {
    state.shareLoading = false;
    render();
  }
}

function normalizeShareFiles(data) {
  const raw = data?.files || data?.items || [];
  return raw.map(f => {
    const name = f.name || splitPath(f.path || f.relPath || '').name;
    const relPath = f.relPath || f.path || name;
    return { name, relPath, path: relPath, type: isVideoName(name) ? 'video' : 'photo', size: Number(f.size || 0) };
  });
}

function shareRawUrl(shareId, relPath) {
  if (!relPath) return `${state.workerBase}/share/${encodeURIComponent(shareId)}/raw`;
  return `${state.workerBase}/share/${encodeURIComponent(shareId)}/item/${encodePath(relPath)}`;
}

function shareThumbUrl(shareId, relPath) {
  return `${state.workerBase}/share/${encodeURIComponent(shareId)}/thumb/${encodePath(relPath)}`;
}

/* ==================== UNDUH FILE (BAGIAN 5.8) ==================== */
async function downloadUrlWithProgress(url, filename, onProgress) {
  const res = await fetchT(url, { method: 'GET' }, 180000);
  if (!res.ok) throw new Error('Gagal mengunduh (' + res.status + ')');
  const total = Number(res.headers.get('Content-Length') || 0);
  if (!res.body || !res.body.getReader) {
    const blob = await res.blob();
    triggerBrowserDownload(blob, filename);
    return;
  }
  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.byteLength;
    if (onProgress) {
      const pct = total ? Math.round((loaded / total) * 100) + '%' : formatBytes(loaded);
      onProgress(pct);
    }
  }
  const blob = new Blob(chunks, { type: res.headers.get('Content-Type') || 'application/octet-stream' });
  triggerBrowserDownload(blob, filename);
}

function triggerBrowserDownload(blob, filename) {
  const objUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = objUrl;
  a.download = filename || 'file';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(objUrl), 4000);
}

/* ==================== MODAL PEMUTAR / PELIHAT (BAGIAN 5.4) ==================== */
async function openModal({ list, index, mode = 'gallery', viewOnly = false, shareId = null }) {
  thumbLoader.pauseVideos();
  if (state.modalObjectUrl) {
    URL.revokeObjectURL(state.modalObjectUrl);
    state.modalObjectUrl = null;
  }
  state.modal = { list, index, mode, viewOnly, shareId };
  await renderModal();
}

function closeModal() {
  if (state.modalObjectUrl) {
    URL.revokeObjectURL(state.modalObjectUrl);
    state.modalObjectUrl = null;
  }
  state.modal = null;
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
  thumbLoader.resumeVideos();
}

async function stepModal(delta) {
  if (!state.modal) return;
  const next = state.modal.index + delta;
  if (next < 0 || next >= state.modal.list.length) return;
  if (state.modalObjectUrl) {
    URL.revokeObjectURL(state.modalObjectUrl);
    state.modalObjectUrl = null;
  }
  state.modal.index = next;
  await renderModal();
}

async function renderModal() {
  const root = document.getElementById('modal-root');
  if (!root || !state.modal) return;
  const { list, index, mode, viewOnly, shareId } = state.modal;
  const item = list[index];
  if (!item) { closeModal(); return; }

  let mediaUrl = '';
  if (mode === 'offline') {
    const blob = await getOfflineBlob(item.path);
    if (blob) {
      state.modalObjectUrl = URL.createObjectURL(blob);
      mediaUrl = state.modalObjectUrl;
    } else {
      mediaUrl = fileMediaUrl(item.path);
    }
  } else if (mode === 'share') {
    mediaUrl = shareRawUrl(shareId, item.relPath === '__SINGLE__' ? '' : item.relPath);
  } else {
    mediaUrl = fileMediaUrl(item.path);
  }

  const isVid = item.type === 'video';
  const isFav = mode !== 'share' && state.favoriteMarks.has(item.path);
  const isOff = mode !== 'share' && (state.offlineLocalMap.has(item.path) || state.offlineMarks.has(item.path));
  const protectAttrs = viewOnly ? 'controlsList="nodownload" disablePictureInPicture' : '';
  const noGrabCls = viewOnly ? 'no-grab' : '';

  root.innerHTML = `
    <div class="viewer-overlay ${noGrabCls}" id="viewer-overlay">
      <div class="viewer-top">
        <span class="badge">${index + 1} / ${list.length}</span>
        <div class="viewer-title">${escapeHtml(item.name)}</div>
        <button class="icon-btn" id="mv-close" aria-label="Tutup">${svgIcon('close', 18)}</button>
      </div>
      <div class="viewer-stage" id="viewer-stage">
        ${index > 0 ? `<button class="viewer-nav prev" id="mv-prev" aria-label="Sebelumnya">${svgIcon('chevronLeft', 22)}</button>` : ''}
        ${isVid
          ? `<video id="mv-video" src="${escapeHtml(mediaUrl)}" controls autoplay playsinline preload="auto" ${protectAttrs}></video>`
          : `<img id="mv-img" src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(item.name)}">`
        }
        ${index < list.length - 1 ? `<button class="viewer-nav next" id="mv-next" aria-label="Berikutnya">${svgIcon('chevronRight', 22)}</button>` : ''}
      </div>
      <div class="viewer-bot">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${!viewOnly ? `<button class="btn btn-gold btn-sm" id="mv-download">${svgIcon('download', 15)} Unduh <span id="mv-dl-prog"></span></button>` : `<span class="muted">Mode Hanya Lihat (tanpa unduh)</span>`}
          ${mode !== 'share' ? `
            <button class="btn btn-secondary btn-sm ${isFav ? 'fav-on' : ''}" data-fav-path="${escapeHtml(item.path)}" id="mv-fav">${svgIcon(isFav ? 'heart' : 'heartOutline', 15)} Favorit</button>
            <button class="btn btn-secondary btn-sm" id="mv-off">${svgIcon(isOff ? 'check' : 'download', 15)} Offline</button>
            <button class="btn btn-secondary btn-sm" id="mv-share">${svgIcon('share', 15)} Bagikan</button>
          ` : ''}
        </div>
        ${mode === 'gallery' ? `<button class="btn btn-danger-outline btn-sm" id="mv-del">${svgIcon('trash', 15)} Hapus</button>` : ''}
      </div>
    </div>
  `;

  if (viewOnly) {
    const ov = document.getElementById('viewer-overlay');
    ov.addEventListener('contextmenu', e => e.preventDefault());
    ov.addEventListener('dragstart', e => e.preventDefault());
  }

  document.getElementById('mv-close').onclick = closeModal;
  const prevBtn = document.getElementById('mv-prev');
  const nextBtn = document.getElementById('mv-next');
  if (prevBtn) prevBtn.onclick = () => stepModal(-1);
  if (nextBtn) nextBtn.onclick = () => stepModal(1);

  const dlBtn = document.getElementById('mv-download');
  if (dlBtn) {
    dlBtn.onclick = async () => {
      dlBtn.disabled = true;
      try {
        if (mode === 'offline' && state.modalObjectUrl) {
          const blob = await getOfflineBlob(item.path);
          if (blob) { triggerBrowserDownload(blob, item.name); return; }
        }
        await downloadUrlWithProgress(mediaUrl, item.name, (p) => setLiveText('mv-dl-prog', '(' + p + ')'));
        showToast('Unduhan selesai: ' + item.name, 'ok');
      } catch (e) {
        showToast('Gagal mengunduh: ' + e.message, 'err');
      } finally {
        setLiveText('mv-dl-prog', '');
        dlBtn.disabled = false;
      }
    };
  }

  const favBtn = document.getElementById('mv-fav');
  if (favBtn) favBtn.onclick = () => toggleFavoriteOptimistic(item);

  const offBtn = document.getElementById('mv-off');
  if (offBtn) {
    offBtn.onclick = async () => {
      offBtn.disabled = true;
      try {
        if (state.offlineLocalMap.has(item.path) || state.offlineMarks.has(item.path)) {
          await removeOfflineItem(item.path);
          offBtn.innerHTML = svgIcon('download', 15) + ' Offline';
          showToast('Dihapus dari offline.');
        } else {
          await markItemOffline(item);
          offBtn.innerHTML = svgIcon('check', 15) + ' Offline';
        }
        render();
      } catch (e) {
        showToast(e.message, 'err');
      } finally {
        offBtn.disabled = false;
      }
    };
  }

  const shareBtn = document.getElementById('mv-share');
  if (shareBtn) {
    shareBtn.onclick = () => {
      state.activeSheet = { type: 'share-create', targetType: 'file', targetPath: item.path, label: item.name };
      render();
    };
  }

  const delBtn = document.getElementById('mv-del');
  if (delBtn) {
    delBtn.onclick = async () => {
      const label = item.type === 'video' ? 'video' : 'foto';
      if (!confirm(`Hapus ${label} ini?\n"${item.name}"`)) return;
      delBtn.disabled = true;
      try {
        await deleteSingleItemAndSyncUi(item);
        const nextList = list.filter(x => x.path !== item.path);
        if (!nextList.length) closeModal();
        else {
          state.modal.list = nextList;
          state.modal.index = Math.min(index, nextList.length - 1);
          await renderModal();
        }
      } catch (e) {
        showToast('Gagal menghapus: ' + e.message, 'err');
        delBtn.disabled = false;
      }
    };
  }

  // Swipe kiri/kanan di area GELAP di luar <video>
  const stage = document.getElementById('viewer-stage');
  let sx = 0, sy = 0, swipeEligible = false;
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { swipeEligible = false; return; }
    const t = e.touches[0];
    const vidEl = document.getElementById('mv-video');
    if (vidEl) {
      // Sentuhan yang mulai di atas elemen <video> diabaikan (agar scrub durasi video aman!)
      if (e.target === vidEl || vidEl.contains(e.target)) { swipeEligible = false; return; }
      const vr = vidEl.getBoundingClientRect();
      if (t.clientX >= vr.left && t.clientX <= vr.right && t.clientY >= vr.top && t.clientY <= vr.bottom) {
        swipeEligible = false; return;
      }
    }
    sx = t.clientX; sy = t.clientY; swipeEligible = true;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!swipeEligible || !e.changedTouches.length) return;
    swipeEligible = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (dx < 0) stepModal(1);
      else stepModal(-1);
    }
  }, { passive: true });
}

/* ==================== AKSI HAPUS & PINDAH ==================== */
async function deleteSingleItemAndSyncUi(item) {
  await deleteRemoteFileWithRetry(item.path);
  state.allItems = state.allItems.filter(x => x.path !== item.path);
  state.selectedPaths.delete(item.path);
  await removeOfflineItem(item.path).catch(() => {});
  if (state.favoriteMarks.has(item.path)) {
    state.favoriteMarks.delete(item.path);
    await deleteFavoriteMarkRemote(item.path).catch(() => {});
  }
  showToast('Item dihapus.', 'ok');
  render();
}

async function executeBulkDelete(paths) {
  const toDelete = state.allItems.filter(it => paths.includes(it.path));
  if (!toDelete.length) return;
  let ok = 0, fail = 0;
  for (const it of toDelete) {
    try {
      await deleteRemoteFileWithRetry(it.path);
      state.allItems = state.allItems.filter(x => x.path !== it.path);
      state.selectedPaths.delete(it.path);
      await removeOfflineItem(it.path).catch(() => {});
      if (state.favoriteMarks.has(it.path)) {
        state.favoriteMarks.delete(it.path);
        await deleteFavoriteMarkRemote(it.path).catch(() => {});
      }
      ok++;
    } catch (_) {
      fail++;
    }
  }
  state.selectMode = false;
  state.selectedPaths.clear();
  showToast(`Hapus: ${ok} berhasil${fail ? ', ' + fail + ' gagal (tetap tampil)' : ''}.`, fail ? 'err' : 'ok');
  render();
}

async function executeMoveItems(paths, destFolder) {
  const existingSet = new Set(state.allItems.map(it => it.path));
  const moves = [];
  for (const from of paths) {
    const sp = splitPath(from);
    if ((sp.folder || null) === (destFolder || null)) continue;
    const to = ensureUniqueTargetKey(destFolder, sp.name, existingSet);
    moves.push({ from, to });
  }
  if (!moves.length) {
    showToast('Item sudah berada di folder tujuan.');
    return;
  }
  const jobId = 'mj_' + Date.now();
  const job = { id: jobId, count: moves.length, dest: destFolder || 'Koleksimu', status: 'running', text: `Memindahkan ${moves.length} item ke ${destFolder || 'Koleksimu'}…` };
  state.moveJobs.push(job);
  state.activeSheet = null;
  state.selectMode = false;
  state.selectedPaths.clear();
  render();

  try {
    await moveRemoteFiles(moves);
    // JANGAN menghapus sumber dari browser; Worker yang salin lalu hapus!
    await migrateMarksAfterMove(moves);
    const moveMap = new Map(moves.map(m => [m.from, m.to]));
    state.allItems = state.allItems.map(it => {
      if (!moveMap.has(it.path)) return it;
      const newPath = moveMap.get(it.path);
      const sp = splitPath(newPath);
      return { ...it, path: newPath, folder: sp.folder, name: sp.name };
    });
    if (destFolder) addFolderWithAncestors(state.explicitFolders, destFolder);
    state.allFolders = buildAllFolders(state.allItems, state.explicitFolders);
    job.status = 'done';
    job.text = `Selesai memindahkan ${moves.length} item ke ${destFolder || 'Koleksimu'}.`;
    showToast(job.text, 'ok');
  } catch (e) {
    job.status = 'error';
    job.text = 'Gagal memindahkan: ' + e.message;
    showToast(job.text, 'err');
  } finally {
    render();
    setTimeout(() => {
      state.moveJobs = state.moveJobs.filter(j => j.id !== jobId);
      if (state.screen === 'gallery') render();
    }, 5000);
  }
}

/* ==================== HELPER FOLDER & DOBEL ==================== */
function getScopeKey() {
  return state.currentTab + '::' + (state.currentFolder || '__root__');
}

function getActiveSection(photosLen, videosLen) {
  const k = getScopeKey();
  let sec = state.sectionByScope[k];
  if (!sec) {
    sec = (photosLen === 0 && videosLen > 0) ? 'video' : 'photo';
    state.sectionByScope[k] = sec;
  }
  return sec;
}

function getFolderItemCount(folderPath) {
  if (!folderPath) return state.allItems.filter(it => it.folder === null).length;
  const prefix = folderPath + '/';
  return state.allItems.filter(it => it.folder === folderPath || (it.folder && it.folder.startsWith(prefix))).length;
}

function getDirectSubfolders(parentFolder) {
  const depth = parentFolder ? parentFolder.split('/').length + 1 : 1;
  const prefix = parentFolder ? parentFolder + '/' : '';
  return state.allFolders.filter(f => {
    if (parentFolder && !f.startsWith(prefix)) return false;
    return f.split('/').length === depth;
  });
}

function findDuplicateSetInList(items) {
  const groups = new Map();
  for (const it of items) {
    if (!it.fp) continue;
    if (!groups.has(it.fp)) groups.set(it.fp, []);
    groups.get(it.fp).push(it);
  }
  const dupPaths = new Set();
  const extraDupPaths = [];
  for (const arr of groups.values()) {
    if (arr.length > 1) {
      arr.sort((a, b) => new Date(a.uploaded || 0).getTime() - new Date(b.uploaded || 0).getTime());
      for (let i = 0; i < arr.length; i++) dupPaths.add(arr[i].path);
      for (let i = 1; i < arr.length; i++) extraDupPaths.push(arr[i].path);
    }
  }
  return { dupPaths, extraDupPaths };
}

        <div class="tile-bot">

  `;
}

function renderUpload() {
  const folderOpts = [`<option value="" ${!state.uploadTargetFolder ? 'selected' : ''}>Koleksimu (tanpa folder)</option>`]
    .concat(state.allFolders.map(f => `<option value="${escapeHtml(f)}" ${state.uploadTargetFolder === f ? 'selected' : ''}>${escapeHtml(f.split('/').join(' / '))}</option>`));

  const dupsCount = state.uploadQueue.filter(q => q.dupInfo && !q.allowDup && q.status !== 'done').length;

  return `
    ${renderBrandHtml(`<button class="btn btn-secondary btn-sm" id="btn-upload-back">${svgIcon('arrowLeft', 15)} Kembali</button>`)}
    <div class="card">
      <h1 class="h1">Unggah Foto &amp; Video</h1>
      <div class="field">
        <label for="up-folder">Simpan ke:</label>
        <select class="input" id="up-folder" ${state.uploadRunning ? 'disabled' : ''}>${folderOpts.join('')}</select>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn btn-gold" style="flex:1;" id="btn-pick-media" ${state.uploadRunning && !state.uploadPaused ? 'disabled' : ''}>${svgIcon('plus', 16)} Pilih Foto / Video</button>
        <button class="btn btn-secondary" id="btn-pick-files" ${state.uploadRunning && !state.uploadPaused ? 'disabled' : ''}>Pilih lewat Berkas (cara lain)</button>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;">
          <input type="checkbox" id="chk-up-off" ${state.uploadAlsoOffline ? 'checked' : ''}> Simpan offline sekalian
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;">
          <input type="checkbox" id="chk-up-fav" ${state.uploadAlsoFavorite ? 'checked' : ''}> Tandai favorit sekalian
        </label>
      </div>
      ${dupsCount ? `
        <div class="alert warn" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
          <span style="display:inline-flex;align-items:center;gap:6px;">${svgIcon('alert', 16)} Ada ${dupsCount} file dobel terdeteksi di antrean.</span>
          <button class="btn btn-secondary btn-sm" id="btn-show-dups">Lihat daftar dobel</button>
        </div>
      ` : ''}
      ${state.uploadSummary ? `<div class="alert ok">${escapeHtml(state.uploadSummary)}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        ${!state.uploadRunning
          ? `<button class="btn btn-gold" style="flex:1;" id="btn-start-upload" ${state.uploadQueue.length === 0 ? 'disabled' : ''}>Simpan &amp; Unggah (${state.uploadQueue.filter(x => x.status !== 'done').length})</button>`
          : (state.uploadPaused
              ? `<button class="btn btn-gold" style="flex:1;" id="btn-resume-upload">${svgIcon('play', 15)} Lanjutkan</button>`
              : `<button class="btn btn-secondary" style="flex:1;" id="btn-pause-upload">${svgIcon('pause', 15)} Jeda</button>`
            )
        }
        ${(state.uploadRunning || state.uploadPaused || state.uploadQueue.length > 0)
          ? `<button class="btn btn-danger-outline" id="btn-cancel-upload">Batal</button>` : ''
        }
      </div>
    </div>
    <div style="margin-top:10px;">
      ${state.uploadQueue.map(q => `
        <div class="q-item ${q.unreadable ? 'bad' : (q.dupInfo && !q.allowDup ? 'dup' : '')}">
          ${q.previewUrl
            ? `<img class="q-thumb" src="${escapeHtml(q.previewUrl)}" alt="">`
            : `<div class="q-thumb">${svgIcon(q.type === 'video' ? 'video' : 'image', 22)}</div>`
          }
          <div class="q-meta">
            <div class="q-name">${escapeHtml(q.name)}</div>
            <div class="muted">${formatBytes(q.size)} · ${q.type === 'video' ? 'Video' : 'Foto'}</div>
            ${q.unreadable ? `<div style="color:#ff9b9b;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;">${svgIcon('alert', 14)} File tidak terbaca</div>` : ''}
            ${q.dupInfo ? `<div style="color:#ffd875;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;">${svgIcon('alert', 14)} DOBEL: ${escapeHtml(q.dupInfo)} ${q.allowDup ? '(Tetap unggah)' : ''}</div>` : ''}
            <div class="muted" id="q-status-${escapeHtml(q.id)}">${escapeHtml(q.progressText || '')}</div>
            <div class="progress-track"><div class="progress-fill" id="q-bar-${escapeHtml(q.id)}" style="width:${q.pct || 0}%"></div></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
              ${q.unreadable ? `
                <button class="btn btn-secondary btn-sm" data-repick-gal="${escapeHtml(q.id)}">Pilih ulang (Galeri)</button>
                <button class="btn btn-secondary btn-sm" data-repick-file="${escapeHtml(q.id)}">Pilih ulang (Berkas)</button>
              ` : ''}
              ${q.dupInfo && !q.allowDup ? `<button class="btn btn-secondary btn-sm" data-keep-dup="${escapeHtml(q.id)}">Tetap unggah</button>` : ''}
              ${q.status !== 'uploading' ? `<button class="btn btn-ghost btn-sm" data-rm-q="${escapeHtml(q.id)}">Buang</button>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderGalleryTabsHtml() {
  const offCount = state.offlineLocalMap.size + Array.from(state.offlineMarks.keys()).filter(p => !state.offlineLocalMap.has(p)).length;
  const favCount = getValidFavoriteItems().length;
  return `
    <div class="tabs" role="tablist">
      <button class="tab-btn ${state.currentTab === 'koleksi' ? 'active' : ''}" data-tab="koleksi">Koleksi</button>

      <button class="tab-btn ${state.currentTab === 'favorit' ? 'active' : ''}" id="tab-fav-btn" data-tab="favorit">Favorit (${favCount})</button>
    </div>
  `;
}

function renderBreadcrumbs() {
  if (!state.currentFolder) return '';
  const segs = state.currentFolder.split('/');
  let acc = '';
  const btns = [`<button class="crumb" data-nav-folder="">Koleksimu</button>`];
  segs.forEach((s, idx) => {
    acc = acc ? acc + '/' + s : s;
    const isLast = idx === segs.length - 1;
    btns.push(`<span class="muted">/</span><button class="crumb ${isLast ? 'current' : ''}" data-nav-folder="${escapeHtml(acc)}">${escapeHtml(s)}</button>`);
  });
  return `<div class="breadcrumbs">${btns.join('')}</div>`;
}

function renderKoleksiTab() {
  if (state.galleryLoadError) {
    return `
      <div class="card" style="margin-top:14px;text-align:center;">
        <div class="alert err">Gagal memuat galeri (cek koneksi internet).<br><span class="muted">${escapeHtml(state.galleryLoadError)}</span></div>
        <button class="btn btn-gold" style="margin-top:14px;" id="btn-retry-gallery">Coba lagi</button>
      </div>
    `;
  }
  const curItems = state.allItems.filter(it => (it.folder || null) === (state.currentFolder || null));
  const photos = curItems.filter(it => it.type === 'photo');
  const videos = curItems.filter(it => it.type === 'video');
  const sec = getActiveSection(photos.length, videos.length);
  const shown = sec === 'video' ? videos : photos;
  const subfolders = getDirectSubfolders(state.currentFolder);
  const { dupPaths, extraDupPaths } = findDuplicateSetInList(shown);

  const curTitle = state.currentFolder ? state.currentFolder.split('/').pop() : 'Koleksimu';
  const nestedTotal = state.currentFolder ? getFolderItemCount(state.currentFolder) : 0;

  return `
    ${renderBreadcrumbs()}
    <div class="toolbar">
      <div style="display:flex;align-items:center;gap:8px;">
        ${state.currentFolder ? `<button class="icon-btn" id="btn-folder-up" aria-label="Kembali">${svgIcon('arrowLeft', 18)}</button>` : ''}
        <h1 class="h1" style="margin:0;">${escapeHtml(curTitle)}</h1>
      </div>
      <div class="toolbar-actions">
        <button class="icon-btn" id="btn-refresh-col" title="Muat ulang">${state.refreshing ? `<span class="spin">${svgIcon('refresh', 18)}</span>` : svgIcon('refresh', 18)}</button>
        <button class="icon-btn" id="btn-manage-folders" title="Kelola / ganti folder">${svgIcon('folder', 18)}</button>
        ${state.currentFolder ? `<button class="icon-btn" id="btn-new-subfolder" title="Buat sub-folder">${svgIcon('folderPlus', 18)}</button>` : ''}
        <button class="icon-btn gold" id="btn-go-upload" title="Unggah">${svgIcon('upload', 18)}</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg-toggle">
        <button class="seg-btn ${sec === 'photo' ? 'active' : ''}" data-sec="photo">Foto (${photos.length})</button>
        <button class="seg-btn ${sec === 'video' ? 'active' : ''}" data-sec="video">Video (${videos.length})</button>
      </div>
      <div class="toolbar-actions">
        ${shown.length ? `
          <button class="btn btn-secondary btn-sm" id="btn-toggle-select">${state.selectMode ? 'Selesai' : 'Pilih'}</button>
          ${state.selectMode ? `<button class="btn btn-secondary btn-sm" id="btn-select-all">Pilih semua</button>` : ''}
        ` : ''}
        ${state.currentFolder ? `
          <button class="btn btn-secondary btn-sm" id="btn-share-folder">${svgIcon('share', 14)} Bagikan folder</button>
          <button class="btn btn-danger-outline btn-sm" id="btn-del-folder" data-cnt="${nestedTotal}">Hapus folder</button>
        ` : ''}
      </div>
    </div>

    ${subfolders.length ? `
      <div class="folder-grid">
        ${subfolders.map(sf => `
          <button class="folder-card" data-open-folder="${escapeHtml(sf)}">
            <span class="folder-ico">${svgIcon('folder', 20)}</span>
            <div style="min-width:0;">
              <div class="folder-name">${escapeHtml(sf.split('/').pop())}</div>
              <div class="folder-cnt">${getFolderItemCount(sf)} item</div>
            </div>
          </button>
        `).join('')}
      </div>
    ` : ''}

    ${extraDupPaths.length ? `
      <div class="alert warn" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <span style="display:inline-flex;align-items:center;gap:6px;">${svgIcon('alert', 16)} Ada ${extraDupPaths.length} foto/video DOBEL di sini</span>
        <button class="btn btn-secondary btn-sm" id="btn-select-dups">Pilih yang dobel (simpan 1 yang paling lama)</button>
      </div>
    ` : ''}

    ${shown.length === 0
      ? `<div class="card" style="margin-top:12px;text-align:center;"><div class="muted">Belum ada ${sec === 'video' ? 'video' : 'foto'} di sini.</div></div>`
      : `<div class="media-grid">
          ${shown.map(it => renderTileHtml(it, {
            mode: 'gallery',
            selected: state.selectedPaths.has(it.path),
            selectMode: state.selectMode,
            isDup: dupPaths.has(it.path),
            isOffline: state.offlineLocalMap.has(it.path) || state.offlineMarks.has(it.path),
            isFav: state.favoriteMarks.has(it.path)
          })).join('')}
        </div>`
    }

    ${state.selectMode && state.selectedPaths.size > 0 ? `
      <div class="bottom-bar">
        <div class="bottom-bar-inner">
          <span class="badge gold">${state.selectedPaths.size} dipilih</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" id="blk-move">Pindah</button>
            <button class="btn btn-secondary btn-sm" id="blk-off">Offline</button>
            <button class="btn btn-secondary btn-sm" id="blk-fav">Favorit</button>
            ${state.selectedPaths.size === 1 ? `<button class="btn btn-secondary btn-sm" id="blk-share">Bagikan</button>` : ''}
            <button class="btn btn-danger btn-sm" id="blk-del">Hapus</button>
          </div>
        </div>
      </div>
    ` : ''}
  `;
}

function renderOfflineTab() {
  const byPath = new Map(state.allItems.map(it => [it.path, it]));
  const localItems = [];
  for (const p of state.offlineLocalMap.keys()) {
    const it = byPath.get(p) || { path: p, name: splitPath(p).name, type: isVideoName(p) ? 'video' : 'photo' };
    localItems.push(it);
  }
  const remoteItems = [];
  for (const p of state.offlineMarks.keys()) {
    if (!state.offlineLocalMap.has(p) && byPath.has(p)) {
      remoteItems.push(byPath.get(p));
    }
  }
  const localPhotos = localItems.filter(x => x.type === 'photo');
  const localVideos = localItems.filter(x => x.type === 'video');
  const remPhotos = remoteItems.filter(x => x.type === 'photo');
  const remVideos = remoteItems.filter(x => x.type === 'video');

  return `
    <div class="toolbar">
      <h1 class="h1" style="margin:0;">Tersimpan di HP ini (${localItems.length})</h1>
      <div class="toolbar-actions">
        ${localItems.length ? `<button class="btn btn-secondary btn-sm" id="btn-off-loc-sel">${state.offlineLocalSelect ? 'Selesai' : 'Pilih'}</button>` : ''}
        ${state.offlineLocalSelect ? `<button class="btn btn-secondary btn-sm" id="btn-off-loc-all">Pilih semua</button>` : ''}
      </div>
    </div>
    ${localPhotos.length ? `<div class="muted" style="margin-top:8px;">Foto (${localPhotos.length})</div><div class="media-grid">${localPhotos.map(it => renderTileHtml(it, { mode: 'offline', selectMode: state.offlineLocalSelect, selected: state.offlineLocalSelected.has(it.path), isOffline: true, isFav: state.favoriteMarks.has(it.path) })).join('')}</div>` : ''}
    ${localVideos.length ? `<div class="muted" style="margin-top:10px;">Video (${localVideos.length})</div><div class="media-grid">${localVideos.map(it => renderTileHtml(it, { mode: 'offline', selectMode: state.offlineLocalSelect, selected: state.offlineLocalSelected.has(it.path), isOffline: true, isFav: state.favoriteMarks.has(it.path) })).join('')}</div>` : ''}
    ${localItems.length === 0 ? `<div class="card" style="margin-top:8px;"><div class="muted">Belum ada file tersimpan lokal di HP ini.</div></div>` : ''}

    <div class="toolbar" style="margin-top:22px;">
      <h2 class="h2" style="margin:0;">Ditandai di akun, dari HP lain (${remoteItems.length})</h2>
      <div class="toolbar-actions">
        ${remoteItems.length ? `<button class="btn btn-secondary btn-sm" id="btn-off-rem-sel">${state.offlineRemoteSelect ? 'Selesai' : 'Pilih'}</button>` : ''}
        ${state.offlineRemoteSelect ? `<button class="btn btn-secondary btn-sm" id="btn-off-rem-all">Pilih semua</button>` : ''}
      </div>
    </div>
    ${remPhotos.length ? `<div class="muted" style="margin-top:8px;">Foto (${remPhotos.length})</div><div class="media-grid">${remPhotos.map(it => renderTileHtml(it, { mode: 'gallery', selectMode: state.offlineRemoteSelect, selected: state.offlineRemoteSelected.has(it.path), isOffline: false, isFav: state.favoriteMarks.has(it.path) })).join('')}</div>` : ''}
    ${remVideos.length ? `<div class="muted" style="margin-top:10px;">Video (${remVideos.length})</div><div class="media-grid">${remVideos.map(it => renderTileHtml(it, { mode: 'gallery', selectMode: state.offlineRemoteSelect, selected: state.offlineRemoteSelected.has(it.path), isOffline: false, isFav: state.favoriteMarks.has(it.path) })).join('')}</div>` : ''}
    ${remoteItems.length === 0 ? `<div class="card" style="margin-top:8px;"><div class="muted">Tidak ada item tertunda dari perangkat lain.</div></div>` : ''}

    ${(state.offlineLocalSelect && state.offlineLocalSelected.size > 0) || (state.offlineRemoteSelect && state.offlineRemoteSelected.size > 0) ? `
      <div class="bottom-bar">
        <div class="bottom-bar-inner">
          <span class="badge gold">${state.offlineLocalSelect ? state.offlineLocalSelected.size : state.offlineRemoteSelected.size} dipilih</span>
          <div style="display:flex;gap:8px;">
            ${state.offlineLocalSelect ? `<button class="btn btn-danger btn-sm" id="blk-off-loc-rm">Hapus dari offline</button>` : ''}
            ${state.offlineRemoteSelect ? `<button class="btn btn-gold btn-sm" id="blk-off-rem-dl">Unduh ke HP ini</button>` : ''}
          </div>
        </div>
      </div>
    ` : ''}
  `;
}

function renderFavoritTab() {

function renderGallery() {

function renderPublicSharePage() {
  if (state.shareLoading) {
    return `${renderShareBrandOnly()}<div class="card" style="display:flex;align-items:center;gap:8px;"><span class="spin">${svgIcon('refresh', 16)}</span> Memuat tautan berbagi…</div>`;
  }
  if (state.shareError) {
    return `${renderShareBrandOnly()}<div class="card"><div class="alert err">${escapeHtml(state.shareError)}</div><button class="btn btn-gold" style="margin-top:12px;" id="btn-retry-share">Coba lagi</button></div>`;
  }
  const d = state.shareData;
  if (!d) return `${renderShareBrandOnly()}<div class="card">Tidak ada data.</div>`;
  const viewOnly = !!(d.viewOnly || d.view_only);

  if (d.type === 'file') {
    const fileName = d.name || splitPath(d.path || '').name || 'Media';
    const isVid = isVideoName(fileName);
    const rawUrl = shareRawUrl(state.shareId, '');
    const protectAttrs = viewOnly ? 'controlsList="nodownload" disablePictureInPicture' : '';
    return `
      ${renderShareBrandOnly()}
      <div class="card ${viewOnly ? 'no-grab' : ''}" id="share-single-card">
        <h1 class="h1">${escapeHtml(fileName)}</h1>
        ${viewOnly ? `<div class="alert warn">Mode Hanya Lihat aktif (pengaman ringan di browser, tidak mencegah tangkap layar).</div>` : ''}
        <div style="margin-top:12px;text-align:center;">
          ${isVid
            ? `<video src="${escapeHtml(rawUrl)}" controls playsinline preload="auto" ${protectAttrs} style="max-width:100%;max-height:70dvh;border-radius:10px;background:#000;"></video>`
            : `<img src="${escapeHtml(rawUrl)}" alt="${escapeHtml(fileName)}" style="max-width:100%;max-height:70dvh;border-radius:10px;">`
          }
        </div>
        ${!viewOnly ? `<div style="margin-top:14px;"><button class="btn btn-gold btn-block" id="btn-share-single-dl" data-url="${escapeHtml(rawUrl)}" data-name="${escapeHtml(fileName)}">${svgIcon('download', 16)} Unduh File</button></div>` : ''}
      </div>
    `;
  }

  // Folder share
  const subfolders = d.folders || d.subfolders || [];
  const files = normalizeShareFiles(d);
  const photos = files.filter(f => f.type === 'photo');
  const videos = files.filter(f => f.type === 'video');
  const shown = state.shareSection === 'video' ? videos : photos;
  const segs = state.sharePath ? state.sharePath.split('/').filter(Boolean) : [];
  let acc = '';

  return `
    ${renderShareBrandOnly()}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <h1 class="h1" style="margin:0;display:inline-flex;align-items:center;gap:8px;">${svgIcon('folder', 20)} ${escapeHtml(d.folderName || splitPath(d.path || '').name || 'Folder Dibagikan')}</h1>
        ${viewOnly ? `<span class="badge warn">Hanya lihat</span>` : ''}
      </div>
      ${viewOnly ? `<div class="muted" style="margin-top:4px;">Mode Hanya Lihat: pengaman ringan tanpa tombol unduh (tidak mencegah tangkap layar).</div>` : ''}
      <div class="breadcrumbs">
        <button class="crumb ${!state.sharePath ? 'current' : ''}" data-share-path="">Utama</button>
        ${segs.map((s, idx) => {
          acc = acc ? acc + '/' + s : s;
          return `<span class="muted">/</span><button class="crumb ${idx === segs.length - 1 ? 'current' : ''}" data-share-path="${escapeHtml(acc)}">${escapeHtml(s)}</button>`;
        }).join('')}
      </div>
      <div class="toolbar">
        <div class="seg-toggle">
          <button class="seg-btn ${state.shareSection === 'photo' ? 'active' : ''}" data-share-sec="photo">Foto (${photos.length})</button>
          <button class="seg-btn ${state.shareSection === 'video' ? 'active' : ''}" data-share-sec="video">Video (${videos.length})</button>
        </div>
        ${!viewOnly && shown.length ? `
          <button class="btn btn-secondary btn-sm" id="btn-share-sel">${state.shareSelectMode ? 'Selesai' : 'Pilih'}</button>
        ` : ''}
      </div>
      ${subfolders.length ? `
        <div class="folder-grid">
          ${subfolders.map(sf => {
            const sfName = typeof sf === 'string' ? sf : sf.name;
            const nextP = state.sharePath ? state.sharePath + '/' + sfName : sfName;
            return `<button class="folder-card" data-share-path="${escapeHtml(nextP)}"><span class="folder-ico">${svgIcon('folder', 20)}</span><div class="folder-name">${escapeHtml(sfName)}</div></button>`;
          }).join('')}
        </div>
      ` : ''}
      ${shown.length === 0
        ? `<div class="muted" style="margin-top:14px;">Belum ada ${state.shareSection === 'video' ? 'video' : 'foto'} di sini.</div>`
        : `<div class="media-grid">
            ${shown.map(it => renderTileHtml(it, {
              mode: 'share',
              shareId: state.shareId,
              selectMode: state.shareSelectMode && !viewOnly,
              selected: state.shareSelected.has(it.relPath)
            })).join('')}
          </div>`
      }
    </div>
    ${!viewOnly && state.shareSelectMode && state.shareSelected.size > 0 ? `
      <div class="bottom-bar">
        <div class="bottom-bar-inner">
          <span class="badge gold">${state.shareSelected.size} dipilih</span>
          <button class="btn btn-gold btn-sm" id="btn-share-dl-sel">${svgIcon('download', 15)} Unduh terpilih</button>
        </div>

  `;
}

/* ==================== TOP SHEETS (FOLDER / PINDAH / DOBEL / SHARE) ==================== */
function renderFolderTreeNodes(parentFolder, depth, mode, qFilter) {
  const children = getDirectSubfolders(parentFolder);
  let html = '';
  for (const f of children) {
    const hasSub = getDirectSubfolders(f).length > 0;
    const isExp = state.expandedMoveFolders.has(f);
    const label = qFilter ? f.split('/').join(' / ') : f.split('/').pop();
    const cnt = getFolderItemCount(f);
    html += `
      <div class="tree-row" style="padding-left:${qFilter ? 0 : depth * 16}px;">
        ${!qFilter && hasSub ? `<button class="tree-toggle" data-tree-toggle="${escapeHtml(f)}">${svgIcon(isExp ? 'minus' : 'menu', 16)}</button>` : (!qFilter ? `<span style="width:36px;display:inline-block;"></span>` : '')}
        <button class="tree-item" data-tree-pick="${escapeHtml(f)}">
          <span class="tree-item-name" style="display:inline-flex;align-items:center;gap:6px;">${svgIcon('folder', 15)} ${escapeHtml(label)}</span>
          <span class="tree-item-cnt">${cnt} item</span>
        </button>
      </div>
    `;
    if (!qFilter && hasSub && isExp) {
      html += renderFolderTreeNodes(f, depth + 1, mode, '');
    }
  }
  return html;
}

function renderActiveSheet() {
  const s = state.activeSheet;
  if (!s) return '';
  if (s.type === 'folder-move' || s.type === 'folder-manage') {
    const isMove = s.type === 'folder-move';
    const q = (s.query || '').trim().toLowerCase();
    const rootCnt = getFolderItemCount(null);
    let treeHtml = '';
    if (q) {
      const matched = state.allFolders.filter(f => f.toLowerCase().includes(q));
      if (!matched.length && !'tanpa folder (koleksimu)'.includes(q)) {
        treeHtml = `<div class="muted" style="padding:16px 4px;text-align:center;">Folder tidak ditemukan.</div>`;
      } else {
        treeHtml = ('tanpa folder (koleksimu)'.includes(q) ? `
          <div class="tree-row"><button class="tree-item" data-tree-pick=""><span class="tree-item-name" style="display:inline-flex;align-items:center;gap:6px;">${svgIcon('home', 15)} Tanpa folder (Koleksimu)</span><span class="tree-item-cnt">${rootCnt} item</span></button></div>
        ` : '') + matched.map(f => `
          <div class="tree-row"><button class="tree-item" data-tree-pick="${escapeHtml(f)}"><span class="tree-item-name" style="display:inline-flex;align-items:center;gap:6px;">${svgIcon('folder', 15)} ${escapeHtml(f.split('/').join(' / '))}</span><span class="tree-item-cnt">${getFolderItemCount(f)} item</span></button></div>
        `).join('');
      }
    } else {
      treeHtml = `
        <div class="tree-row">
          <span style="width:36px;display:inline-block;"></span>
          <button class="tree-item" data-tree-pick=""><span class="tree-item-name" style="display:inline-flex;align-items:center;gap:6px;">${svgIcon('home', 15)} Tanpa folder (Koleksimu)</span><span class="tree-item-cnt">${rootCnt} item</span></button>
        </div>

    return `
      <div class="sheet-backdrop" id="sheet-backdrop">
        <div class="sheet-top">

              <button class="icon-btn" id="sheet-close" aria-label="Tutup">${svgIcon('close', 18)}</button>
            </div>
            <input class="input" id="sheet-folder-search" placeholder="Cari folder…" value="${escapeHtml(s.query || '')}">
            <div style="display:flex;gap:6px;margin-top:8px;">
              <input class="input" id="sheet-new-folder-name" placeholder="Buat folder baru… (mis. Liburan)">
              <button class="btn btn-gold btn-sm" id="sheet-create-folder">${svgIcon('plus', 15)} Buat</button>
            </div>
          </div>
          <div class="sheet-body" id="sheet-scroll-body">${treeHtml}</div>
        </div>
      </div>
    `;
  }

  if (s.type === 'dup-list') {
    return `
      <div class="sheet-backdrop" id="sheet-backdrop">
        <div class="sheet-top">
          <div class="sheet-head" style="display:flex;align-items:center;justify-content:space-between;">
            <div class="h2" style="margin:0;">Daftar File Dobel (${s.dups.length})</div>
            <button class="icon-btn" id="sheet-close" aria-label="Tutup">${svgIcon('close', 18)}</button>
          </div>
          <div class="sheet-body">
            ${s.dups.map(d => `
              <div class="alert warn" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <div style="min-width:0;">
                  <div style="font-weight:700;word-break:break-all;display:flex;align-items:center;gap:6px;">${svgIcon('alert', 15)} DOBEL: ${escapeHtml(d.name)}</div>
                  <div class="muted">${escapeHtml(d.dupInfo || '')}</div>
                </div>
                <button class="btn btn-secondary btn-sm" data-sheet-keep-dup="${escapeHtml(d.id)}">${d.allowDup ? `${svgIcon('check', 14)} Tetap` : 'Tetap unggah'}</button>
              </div>
            `).join('')}
            <div style="display:flex;gap:8px;margin-top:14px;">
              <button class="btn btn-danger-outline" style="flex:1;" id="sheet-rm-all-dups">Hapus yang dobel dari antrean</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  if (s.type === 'share-create') {
    return `
      <div class="sheet-backdrop" id="sheet-backdrop">
        <div class="sheet-top">
          <div class="sheet-head" style="display:flex;align-items:center;justify-content:space-between;">
            <div class="h2" style="margin:0;">Bagikan: ${escapeHtml(s.label)}</div>
            <button class="icon-btn" id="sheet-close" aria-label="Tutup">${svgIcon('close', 18)}</button>
          </div>
          <div class="sheet-body">
            ${!s.shareId ? `
              <p class="muted">Pilih izin akses untuk penerima tautan publik ini:</p>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <button class="btn btn-gold btn-block" id="btn-mk-share-dl">Bisa diunduh</button>
                <button class="btn btn-secondary btn-block" id="btn-mk-share-vo">Hanya lihat (tanpa unduh)</button>
              </div>
              <div class="muted" style="margin-top:10px;font-size:12px;">Catatan jujur: mode Hanya Lihat adalah pengaman ringan di browser dan tidak mencegah tangkap layar (screenshot).</div>
              ${s.err ? `<div class="alert err" style="white-space:pre-wrap;">${escapeHtml(s.err)}</div>` : ''}
            ` : `
              <div class="alert ok">Tautan berbagi berhasil dibuat!</div>
              <input class="input" readonly id="share-url-box" value="${escapeHtml(buildPublicShareUrl(s.shareId))}" style="margin-top:10px;">
              <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="btn btn-gold" style="flex:1;" id="btn-copy-share">Salin</button>
                <button class="btn btn-danger-outline" id="btn-revoke-share">Cabut link</button>

            <button class="icon-btn" id="sheet-close" aria-label="Tutup">${svgIcon('close', 18)}</button>
          </div>
          <div class="sheet-body">
            <div class="alert err">
              Anda akan menghapus folder <b>“${escapeHtml(s.folder)}”</b> beserta semua <b>${s.count} item</b> di dalamnya secara permanen (termasuk sub-folder, tanda offline, favorit, dan share terkait).
